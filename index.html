        <div style={{fontSize:11,color:"#64748b"}}>Cuota quincenal</div>
        <div style={{fontSize:18,fontWeight:700,color:"#059669"}}>{fmt(calcResultado.cuota)}</div>
      </div>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:11,color:"#64748b"}}>Total a pagar</div>
        <div style={{fontSize:18,fontWeight:700,color:"#2563eb"}}>{fmt(calcResultado.totalPagar)}</div>
      </div>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:11,color:"#64748b"}}>Total interés</div>
        <div style={{fontSize:18,fontWeight:700,color:"#7c3aed"}}>{fmt(calcResultado.totalInteres)}</div>
      </div>
    </div>}

    <h3 style={s.h3}>Registrar nuevo préstamo</h3>
    <div style={s.form}>
      <select style={s.input} value={clienteId} onChange={e=>setClienteId(e.target.value)}>
        <option value="">Seleccionar cliente…</option>
        {datos.clientes.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
      </select>
      <select style={s.input} value={proveedor} onChange={e=>setProveedor(e.target.value)}>
        <option value="">Seleccionar proveedor…</option>
        {datos.proveedores.map(p=><option key={p.id} value={p.id}>{p.nombre} ({p.tasa}%)</option>)}
      </select>
      <input style={s.input} type="number" placeholder="Monto ($)" value={monto} onChange={e=>setMonto(e.target.value)}/>
      <input style={s.input} type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/>
      <input style={{...s.input,flex:"0 1 130px"}} type="number" placeholder="Tasa cliente (%)" value={tasaPersonal} onChange={e=>setTasaPersonal(e.target.value)}/>
      <button style={s.btn} onClick={agregar}>+ Registrar</button>
    </div>
    {/* Filtros */}
    <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14,background:"#fff",padding:12,borderRadius:10,boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
      <select style={{...s.input,flex:"1 1 140px"}} value={filtCliente} onChange={e=>setFiltCliente(e.target.value)}>
        <option value="">Todos los clientes</option>
        {datos.clientes.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
      </select>
      <select style={{...s.input,flex:"1 1 140px"}} value={filtProveedor} onChange={e=>setFiltProveedor(e.target.value)}>
        <option value="">Todos los proveedores</option>
        {datos.proveedores.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
      </select>
      <select style={{...s.input,flex:"1 1 120px"}} value={filtEstado} onChange={e=>setFiltEstado(e.target.value)}>
        <option value="">Todos los estados</option>
        <option value="activo">Activo</option>
        <option value="pagado">Pagado</option>
      </select>
      <select style={{...s.input,flex:"1 1 120px"}} value={filtColor} onChange={e=>setFiltColor(e.target.value)}>
        <option value="">Todos</option>
        <option value="verde">🟢 Pagaron</option>
        <option value="normal">⚪ Esta quincena</option>
        <option value="amarillo">🟡 Vencidos 1-18 días</option>
        <option value="mora_anterior">🔴 Mora anterior (+18 días)</option>
      </select>
      <select style={{...s.input,flex:"1 1 140px"}} value={filtTrabajo} onChange={e=>setFiltTrabajo(e.target.value)}>
        <option value="">Todos los trabajos</option>
        {trabajosUnicos.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
      {(filtCliente||filtProveedor||filtEstado||filtColor||filtTrabajo)&&<button style={{...s.btnDanger,padding:"8px 12px"}} onClick={()=>{setFiltCliente("");setFiltProveedor("");setFiltEstado("");setFiltColor("");setFiltTrabajo("");}}>✕ Limpiar</button>}
      <button style={{padding:"8px 14px",background:"#dc2626",color:"#fff",border:"none",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer"}} onClick={exportarListaFiltrada}>📄 Descargar lista (PDF) — {prestamosFiltradosPDF.length} préstamo(s)</button>
    </div>
    {datos.prestamos.length===0?<p style={s.empty}>No hay préstamos registrados.</p>:
      <div style={{overflowX:"auto"}}><table style={s.tabla}>
        <thead><tr>{["Cliente","Proveedor","Capital","Saldo","Tasa","Interés","Próx. pago","Estado",""].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
        <tbody>{datos.prestamos.map(p=>{
          const cl=datos.clientes.find(c=>c.id===p.clienteId);
          const pv=provMap[p.proveedor];
          const tc=p.tasaCliente||0.15;
          const ahora=new Date();
          const proxPago=new Date(p.proximoPago+"T00:00:00");
          const diasVencido=Math.floor((ahora-proxPago)/(1000*60*60*24));
          const ultimoPago=[...datos.pagos].filter(x=>x.prestamoId===p.id).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0];
          const pagoEnEstaPeriodo=ultimoPago&&new Date(ultimoPago.fecha+"T00:00:00")>=new Date(proxPago.getTime()-16*24*60*60*1000);
          let rowBg="transparent";
          let colorTag="normal";
          // Determinar si es mora de quincena anterior (más de 18 días vencido)
          const esMoraAnterior=diasVencido>18;
          if(p.estado!=="pagado"){
            if(pagoEnEstaPeriodo){rowBg="#dcfce7";colorTag="verde";}
            else if(esMoraAnterior){rowBg="#fee2e2";colorTag="mora_anterior";}
            else if(diasVencido>3){rowBg="#fef9c3";colorTag="amarillo";}
          }
          // Aplicar filtros
          if(filtCliente && p.clienteId!==filtCliente) return null;
          if(filtProveedor && p.proveedor!==filtProveedor) return null;
          if(filtEstado && p.estado!==filtEstado) return null;
          if(filtColor && colorTag!==filtColor) return null;
          if(filtTrabajo && (cl?.trabajo||"").trim()!==filtTrabajo) return null;
          return <tr key={p.id} style={p.estado==="pagado"?{opacity:0.5}:{background:rowBg}}>
            <td style={s.td}>{cl?.nombre||<span style={{color:"#dc2626"}}>Sin cliente</span>}
              {p.registradoPor && <span style={{marginLeft:6,fontSize:10,background:"#dcfce7",color:"#166534",padding:"1px 6px",borderRadius:99,fontWeight:600}} title={"Préstamo registrado por "+p.registradoPor+(p.fechaRegistro?" el "+p.fechaRegistro.substring(0,10):"")}>📌 {p.registradoPor.split(" ")[0]}</span>}
            </td>
            <td style={s.td}>{pv?.nombre.split(" ")[0]||"—"}</td>
            <td style={s.td}>{editCapId===p.id
              ?<div style={{display:"flex",gap:4}}>
                  <input style={{...s.input,flex:"none",width:75,padding:"4px 6px"}} type="number" value={editCapVal} onChange={e=>setEditCapVal(e.target.value)}/>
                  <button style={{...s.btn,padding:"4px 8px",fontSize:11}} onClick={()=>{
                    const nuevoValor=parseFloat(editCapVal);
                    if(isNaN(nuevoValor)||nuevoValor<0) return;
                    actualizar({...datos,prestamos:datos.prestamos.map(x=>x.id===p.id?{...x,capitalInicial:nuevoValor}:x)});
                    setEditCapId(null);
                  }}>✔</button>
                  <button style={{...s.btnDanger,padding:"4px 8px"}} onClick={()=>setEditCapId(null)}>✕</button>
                </div>
              :<span style={{cursor:"pointer",color:"#2563eb",fontWeight:600}} onClick={()=>{setEditCapId(p.id);setEditCapVal(p.capitalInicial.toFixed(2));}}>{fmt(p.capitalInicial)} ✏</span>
            }</td>
            <td style={s.td}>{editSaldoId===p.id
              ?<div style={{display:"flex",gap:4}}>
                  <input style={{...s.input,flex:"none",width:75,padding:"4px 6px"}} type="number" value={editSaldoVal} onChange={e=>setEditSaldoVal(e.target.value)}/>
                  <button style={{...s.btn,padding:"4px 8px",fontSize:11}} onClick={()=>{
                    const nuevoValor=parseFloat(editSaldoVal);
                    if(isNaN(nuevoValor)||nuevoValor<0) return;
                    actualizar({...datos,prestamos:datos.prestamos.map(x=>x.id===p.id?{...x,saldo:nuevoValor,estado:nuevoValor===0?"pagado":"activo"}:x)});
                    setEditSaldoId(null);
                  }}>✔</button>
                  <button style={{...s.btnDanger,padding:"4px 8px"}} onClick={()=>setEditSaldoId(null)}>✕</button>
                </div>
              :<span style={{cursor:"pointer",color:"#dc2626",fontWeight:600}} onClick={()=>{setEditSaldoId(p.id);setEditSaldoVal(p.saldo.toFixed(2));}}>{fmt(p.saldo)} ✏</span>
            }</td>
            <td style={s.td}>{editTasaId===p.id
              ?<div style={{display:"flex",gap:4}}>
                  <input style={{...s.input,flex:"none",width:60,padding:"4px 6px"}} type="number" value={editTasaVal} onChange={e=>setEditTasaVal(e.target.value)}/>
                  <button style={{...s.btn,padding:"4px 8px",fontSize:11}} onClick={()=>guardarTasa(p.id)}>✔</button>
                  <button style={{...s.btnDanger,padding:"4px 8px"}} onClick={()=>setEditTasaId(null)}>✕</button>
                </div>
              :<span style={{cursor:"pointer",color:"#2563eb",fontWeight:600}} onClick={()=>{setEditTasaId(p.id);setEditTasaVal((tc*100).toFixed(1));}}>{(tc*100).toFixed(1)}% ✏</span>
            }</td>
            <td style={s.td}>{fmt(p.saldo*tc)}</td>
            <td style={s.td}>{editFechaId===p.id
              ?<div style={{display:"flex",gap:4}}>
                  <input style={{...s.input,flex:"none",width:130,padding:"4px 6px"}} type="date" value={editFechaVal} onChange={e=>setEditFechaVal(e.target.value)}/>
                  <button style={{...s.btn,padding:"4px 8px",fontSize:11}} onClick={()=>{
                    if(!editFechaVal) return;
                    actualizar({...datos,prestamos:datos.prestamos.map(x=>x.id===p.id?{...x,proximoPago:editFechaVal}:x)});
                    setEditFechaId(null);
                  }}>✔</button>
                  <button style={{...s.btnDanger,padding:"4px 8px"}} onClick={()=>setEditFechaId(null)}>✕</button>
                </div>
              :<span style={{cursor:"pointer",color:"#2563eb",fontWeight:600}} onClick={()=>{setEditFechaId(p.id);setEditFechaVal(p.proximoPago||hoy());}}>{p.proximoPago} ✏</span>
            }</td>
            <td style={s.td}><span style={{color:p.estado==="activo"?"#059669":"#6b7280"}}>{p.estado==="activo"?"Activo":"Pagado"}</span></td>
            <td style={s.td}><div style={{display:"flex",gap:4}}>
              <button style={{...s.btnSec,padding:"4px 8px",fontSize:11}} onClick={()=>generarContrato(p,cl,pv)}>📄 PDF</button>
              {p.estado==="pagado" && <button style={{padding:"4px 8px",background:"#059669",color:"#fff",border:"none",borderRadius:4,fontSize:11,cursor:"pointer",fontWeight:600}} onClick={()=>{
                const monto=prompt("Monto del nuevo préstamo para "+(cl?.nombre||"cliente")+":");
                if(!monto||isNaN(parseFloat(monto))) return;
                const capital=parseFloat(monto);
                actualizar({...datos,prestamos:[...datos.prestamos,{
                  id:Date.now().toString(),clienteId:p.clienteId,proveedor:p.proveedor,
                  capitalInicial:capital,saldo:capital,fechaInicio:hoy(),
                  proximoPago:proximaQuincena(hoy()),estado:"activo",tasaCliente:p.tasaCliente||0.15
                }]});
                alert("✔ Préstamo renovado por $"+capital.toFixed(2));
              }}>🔄 Renovar</button>}
              <button style={s.btnDanger} onClick={()=>eliminarPrestamo(p.id)}>Eliminar</button>
            </div></td>
          </tr>;
        })}</tbody>
      </table></div>}
  </div>;
}

function Pagos({datos,actualizar}){
  const [prestamoId,setPrestamoId]=React.useState("");
  const [montoPago,setMontoPago]=React.useState("");
  const [fechaPago,setFechaPago]=React.useState(hoy());
  const [nota,setNota]=React.useState("");
  const [detalle,setDetalle]=React.useState(null);
  const [buscarCliente,setBuscarCliente]=React.useState("");
  const provMap=Object.fromEntries(datos.proveedores.map(p=>[p.id,p]));
  const prestamosActivos=datos.prestamos.filter(p=>p.saldo>0).map(p=>({...p,cliente:datos.clientes.find(c=>c.id===p.clienteId)}));
  const prestamosActivosFiltrados=prestamosActivos.filter(p=>
    !buscarCliente || (p.cliente?.nombre||"").toLowerCase().includes(buscarCliente.toLowerCase())
  );
  const [soloCapital,setSoloCapital]=React.useState(false);

  const calcular=()=>{
    const p=datos.prestamos.find(x=>x.id===prestamoId);
    if(!p||!montoPago) return;
    const prov=provMap[p.proveedor]; if(!prov) return;
    const tc=p.tasaCliente||0.15;
    const tasaProv=prov.tasa/100;
    // Calcular quincenas vencidas contando FECHAS de quincena (15 y 30) que pasaron
    const ahora=new Date();
    const proxPago=new Date(p.proximoPago+"T00:00:00");
    // Contar cuántas fechas de quincena (15 o 30) pasaron desde proximoPago hasta hoy (sin incluir la del proximoPago)
    let quincenasExtras=0;
    if(ahora>proxPago){
      let cursor=new Date(proxPago);
      while(true){
        // Avanzar a la siguiente quincena desde cursor
        const d=cursor.getDate();
        let siguiente;
        if(d<15){siguiente=new Date(cursor.getFullYear(),cursor.getMonth(),15);}
        else if(d<30){siguiente=new Date(cursor.getFullYear(),cursor.getMonth(),30);}
        else {siguiente=new Date(cursor.getFullYear(),cursor.getMonth()+1,15);}
        if(siguiente<=ahora){quincenasExtras++;cursor=siguiente;}
        else break;
        if(quincenasExtras>24) break;
      }
    }
    const quincenasVencidas=quincenasExtras;
    const quincenasTotales=1+quincenasExtras;
    // Interés atrasado (quincenas adicionales que pasaron) + interés de su quincena
    const interesAtrasado=quincenasExtras>0?p.saldo*tc*quincenasExtras:0;
    const interesActual=p.saldo*tc;
    const interesTotal=soloCapital?0:(interesAtrasado+interesActual);
    const pago=parseFloat(montoPago);
    let interesAplicado=0;
    let capitalAplicado=0;
    if(soloCapital){
      interesAplicado=0;
      capitalAplicado=pago;
    } else {
      interesAplicado=Math.min(pago,interesTotal);
      capitalAplicado=Math.max(0,pago-interesTotal);
    }
    const nuevoSaldo=Math.max(0,p.saldo-capitalAplicado);
    setDetalle({
      interesAtrasado,interesActual,interesTotal,
      interesAplicado,capitalAplicado,nuevoSaldo,
      gananciaJorge:soloCapital?0:p.saldo*(tc-tasaProv)*quincenasTotales,
      gananciaProv:soloCapital?0:p.saldo*tasaProv*quincenasTotales,
      tc,prov,p,soloCapital,quincenasVencidas,quincenasTotales
    });
  };
  const registrar=()=>{
    if(!detalle) return;
    const {nuevoSaldo,gananciaJorge,gananciaProv,p}=detalle;
    const pagoId=Date.now().toString();
    const pago={id:pagoId,prestamoId,fecha:fechaPago,monto:parseFloat(montoPago),interesAplicado:detalle.interesAplicado,capitalAplicado:detalle.capitalAplicado,
      saldoAnterior:p.saldo,nuevoSaldo,gananciaJorge,gananciaProv,nota,
      // Guardamos el estado exacto del préstamo ANTES de este pago, para poder revertirlo si se borra por error
      proximoPagoAnterior:p.proximoPago, estadoAnterior:p.estado};
    const nuevosPrestamos=datos.prestamos.map(pr=>pr.id===prestamoId?{...pr,saldo:nuevoSaldo,estado:nuevoSaldo===0?"pagado":"activo",proximoPago:nuevoSaldo>0?proximaQuincena(fechaPago):pr.proximoPago}:pr);
    let nf={...datos.fondoMutuo};
    if(detalle.prov.fondo){
      nf.saldoJorge+=gananciaJorge;
      nf.movimientos=[...nf.movimientos,{fecha:fechaPago,tipo:"Interés cobrado",monto:detalle.interesAplicado,detalle:`Pago de ${datos.clientes.find(c=>c.id===p.clienteId)?.nombre}`,pagoId}];
    }
    actualizar({...datos,prestamos:nuevosPrestamos,pagos:[...datos.pagos,pago],fondoMutuo:nf});
    setPrestamoId("");setMontoPago("");setNota("");setDetalle(null);
  };
  const eliminarPago=(pg)=>{
    if(!confirm(`¿Deshacer este pago de ${fmt(pg.monto)}? El préstamo volverá a su saldo y fecha de antes de este pago.`)) return;
    const pr=datos.prestamos.find(x=>x.id===pg.prestamoId);
    let nuevosPrestamos=datos.prestamos;
    if(pr){
      nuevosPrestamos=datos.prestamos.map(x=>x.id===pr.id?{
        ...x,
        saldo: pg.saldoAnterior!==undefined?pg.saldoAnterior:x.saldo,
        estado: pg.estadoAnterior || (pg.saldoAnterior>0?"activo":x.estado),
        proximoPago: pg.proximoPagoAnterior || x.proximoPago
      }:x);
    }
    let nf={...datos.fondoMutuo};
    if(pg.gananciaJorge){
      nf.saldoJorge -= pg.gananciaJorge;
      nf.movimientos = nf.movimientos.filter(m=>m.pagoId!==pg.id);
    }
    actualizar({...datos, prestamos:nuevosPrestamos, pagos:datos.pagos.filter(x=>x.id!==pg.id), fondoMutuo:nf});
  };
  const historial=[...datos.pagos].reverse().map(pg=>{
    const pr=datos.prestamos.find(x=>x.id===pg.prestamoId);
    return {...pg,cliente:datos.clientes.find(c=>c.id===pr?.clienteId)};
  });
  return <div>
    <h2 style={s.h2}>Registrar pago</h2>
    <div style={s.form}>
      <input style={{...s.input,flex:"1 1 200px"}} placeholder="🔍 Buscar cliente por nombre..." value={buscarCliente} onChange={e=>setBuscarCliente(e.target.value)}/>
      <select style={s.input} value={prestamoId} onChange={e=>{setPrestamoId(e.target.value);setDetalle(null);}}>
        <option value="">{buscarCliente?`Seleccionar (${prestamosActivosFiltrados.length} encontrado(s))…`:"Seleccionar préstamo activo…"}</option>
        {prestamosActivosFiltrados.map(p=>{
          const tc=p.tasaCliente||0.15;
          return <option key={p.id} value={p.id}>{p.cliente?.nombre} — {fmt(p.saldo)} ({provMap[p.proveedor]?.nombre.split(" ")[0]}) {(tc*100).toFixed(1)}%</option>;
        })}
      </select>
      <input style={s.input} type="number" placeholder="Monto recibido ($)" value={montoPago} onChange={e=>{setMontoPago(e.target.value);setDetalle(null);}}/>
      <input style={s.input} type="date" value={fechaPago} onChange={e=>setFechaPago(e.target.value)}/>
      <input style={s.input} placeholder="Nota (opcional)" value={nota} onChange={e=>setNota(e.target.value)}/>
      <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#475569",whiteSpace:"nowrap"}}>
        <input type="checkbox" checked={soloCapital} onChange={e=>{setSoloCapital(e.target.checked);setDetalle(null);}}/>
        Solo capital (sin interés)
      </label>
      <button style={s.btnSec} onClick={calcular}>Calcular</button>
    </div>
    {detalle && <div style={s.detalleBox}>
      <h3 style={{margin:"0 0 10px",color:"#1e293b"}}>Desglose del pago</h3>
      {detalle.quincenasVencidas>0 && <div style={{background:"#fee2e2",borderRadius:6,padding:"8px 12px",marginBottom:10,fontSize:13,color:"#dc2626",fontWeight:600}}>
        ⚠ Cliente en mora: {detalle.quincenasVencidas} quincena(s) vencida(s)
      </div>}
      {detalle.quincenasVencidas>0 && <Fila label={`Interés atrasado (${detalle.quincenasVencidas} quincena(s))`} valor={fmt(detalle.interesAtrasado)} color="#dc2626"/>}
      <Fila label={`Interés quincena actual (${(detalle.tc*100).toFixed(1)}%)`} valor={fmt(detalle.interesActual)}/>
      <Fila label="Total interés a cobrar" valor={fmt(detalle.interesTotal)} bold/>
      <Fila label="Interés aplicado"  valor={fmt(detalle.interesAplicado)}/>
      <Fila label="Capital aplicado"  valor={fmt(detalle.capitalAplicado)}/>
      <Fila label="Nuevo saldo"       valor={fmt(detalle.nuevoSaldo)} bold/>
      <div style={s.divider}/>
      <Fila label={`Ganancia ${detalle.prov.nombre.split(" ")[0]} (${detalle.prov.tasa}%)`} valor={fmt(detalle.gananciaProv)} color="#2563eb"/>
      <Fila label={`Tu ganancia (${((detalle.tc-detalle.prov.tasa/100)*100).toFixed(1)}%)`} valor={fmt(detalle.gananciaJorge)} color="#7c3aed" bold/>
      {detalle.prov.fondo && <p style={{color:"#059669",fontSize:12,marginTop:8}}>✔ Los intereses van al fondo mutuo.</p>}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:12}}>
        <button style={{padding:"8px 14px",background:"#7c3aed",color:"#fff",border:"none",borderRadius:6,fontSize:13,cursor:"pointer",fontWeight:600}} onClick={()=>{
          const cl=datos.clientes.find(c=>c.id===detalle.p.clienteId);
          const {jsPDF}=window.jspdf;
          const doc=new jsPDF({format:[80,140]});
          let y=10;
          doc.setFontSize(12);doc.setFont("helvetica","bold");
          doc.text("PrestJRC",40,y,{align:"center"});y+=5;
          doc.setFontSize(8);doc.setFont("helvetica","normal");
          doc.text("RECIBO DE PAGO",40,y,{align:"center"});y+=7;
          doc.setLineWidth(0.3);doc.line(8,y,72,y);y+=6;
          doc.setFontSize(8);
          doc.text("Fecha: "+fechaPago,8,y);y+=5;
          doc.text("Cliente: "+(cl?.nombre||"—"),8,y);y+=7;
          doc.setFont("helvetica","bold");doc.setFontSize(9);
          doc.text("Monto pagado: $"+parseFloat(montoPago).toFixed(2),8,y);y+=6;
          doc.setFont("helvetica","normal");doc.setFontSize(8);
          doc.text("Interes: $"+detalle.interesAplicado.toFixed(2),8,y);y+=5;
          doc.text("Capital: $"+detalle.capitalAplicado.toFixed(2),8,y);y+=7;
          doc.setLineWidth(0.3);doc.line(8,y,72,y);y+=6;
          doc.setFont("helvetica","bold");doc.setFontSize(10);
          doc.text("SALDO: $"+detalle.nuevoSaldo.toFixed(2),40,y,{align:"center"});y+=8;
          doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(120,120,120);
          doc.text("Gracias por su pago",40,y,{align:"center"});
          doc.save("Recibo_"+(cl?.nombre||"cliente").replace(/ /g,"_")+"_"+fechaPago+".pdf");

          const etiqueta=ini.getDate()+" "+nombresMes[ini.getMonth()]+" – "+fin.getDate()+" "+nombresMes[fin.getMonth()]+" "+fin.getFullYear();

}

function FondoMutuo({datos,actualizar}){
  const [tipo,setTipo]=React.useState("reinversion");
  const [monto,setMonto]=React.useState("");
  const [fecha,setFecha]=React.useState(hoy());
  const [nota,setNota]=React.useState("");
  const registrar=()=>{
    if(!monto||isNaN(parseFloat(monto))) return;
    const m=parseFloat(monto);
    let nf={...datos.fondoMutuo,movimientos:[...datos.fondoMutuo.movimientos,{fecha,tipo,monto:m,detalle:nota}]};
    if(tipo==="retiro")      nf.saldoJorge=Math.max(0,nf.saldoJorge-m);
    if(tipo==="reinversion") nf.saldoJorge+=m;
    actualizar({...datos,fondoMutuo:nf}); setMonto("");setNota("");
  };
  const f=datos.fondoMutuo;
  return <div>
    <h2 style={s.h2}>Fondo Mutuo — Milixa Yariela</h2>
    <div style={s.cards}>
      <Tarjeta titulo="Capital de Milixa" valor={fmt(f.saldoMilixa)}              color="#2563eb"/>
      <Tarjeta titulo="Tu acumulado"      valor={fmt(f.saldoJorge)}               color="#7c3aed"/>
      <Tarjeta titulo="Total en fondo"    valor={fmt(f.saldoMilixa+f.saldoJorge)} color="#059669"/>
    </div>
    <h3 style={s.h3}>Registrar movimiento manual</h3>
    <div style={s.form}>
      <select style={s.input} value={tipo} onChange={e=>setTipo(e.target.value)}>
        <option value="reinversion">Reinversión</option>
        <option value="retiro">Retiro</option>
        <option value="otro">Otro</option>
      </select>
      <input style={s.input} type="number" placeholder="Monto ($)" value={monto} onChange={e=>setMonto(e.target.value)}/>
      <input style={s.input} type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/>
      <input style={s.input} placeholder="Nota" value={nota} onChange={e=>setNota(e.target.value)}/>
      <button style={s.btn} onClick={registrar}>Registrar</button>
    </div>
    <h3 style={s.h3}>Movimientos</h3>
    {f.movimientos.length===0?<p style={s.empty}>No hay movimientos todavía.</p>:
      <div style={{overflowX:"auto"}}><table style={s.tabla}>
        <thead><tr>{["Fecha","Tipo","Monto","Detalle"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
        <tbody>{[...f.movimientos].reverse().map((m,i)=><tr key={i}>
          <td style={s.td}>{m.fecha}</td>
          <td style={s.td}>{m.tipo}</td>
          <td style={s.td}>{fmt(m.monto)}</td>
          <td style={s.td}>{m.detalle||"—"}</td>
        </tr>)}</tbody>
      </table></div>}
  </div>;
}

function ProveedorCrecimiento({datos,provMap,bucketQuincena,fmt,s}){
  const [provSel,setProvSel]=React.useState(datos.proveedores[0]?.id||"");

  const stats=(()=>{
    if(!provSel) return [];
    const buckets={};
    datos.prestamos.filter(p=>p.proveedor===provSel && p.fechaInicio).forEach(p=>{
      const {clave,etiqueta}=bucketQuincena(p.fechaInicio);
      if(!buckets[clave]) buckets[clave]={clave,etiqueta,prestado:0,interes:0};
      buckets[clave].prestado+=(p.capitalInicial||0);
    });
    datos.pagos.forEach(pg=>{
      const pr=datos.prestamos.find(x=>x.id===pg.prestamoId);
      if(!pr||pr.proveedor!==provSel||!pg.fecha) return;
      const {clave,etiqueta}=bucketQuincena(pg.fecha);
      if(!buckets[clave]) buckets[clave]={clave,etiqueta,prestado:0,interes:0};
      buckets[clave].interes+=(pg.interesAplicado||0);
    });
    let acumulado=0;
    return Object.values(buckets).sort((a,b)=>a.clave.localeCompare(b.clave)).map(b=>{
      acumulado+=b.prestado;
      return {...b,acumulado};
    });
  })();

  const maxValor=Math.max(...stats.map(b=>Math.max(b.prestado,b.interes)),1);

  return <>
    <h3 style={s.h3}>Crecimiento por proveedor (quincena a quincena)</h3>
    <div style={{marginBottom:12}}>
      <select style={{...s.input,maxWidth:280}} value={provSel} onChange={e=>setProvSel(e.target.value)}>
        {datos.proveedores.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
      </select>
    </div>
    {stats.length===0?<p style={s.empty}>Este proveedor todavía no tiene préstamos o pagos registrados.</p>:<>
      <div style={{background:"#fff",borderRadius:10,padding:16,boxShadow:"0 1px 3px rgba(0,0,0,.07)",marginBottom:16}}>
        <div style={{display:"flex",gap:14,marginBottom:10,fontSize:11}}>
          <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,background:"#2563eb",display:"inline-block",borderRadius:2}}/>Monto prestado</span>
          <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,background:"#d97706",display:"inline-block",borderRadius:2}}/>Interés generado</span>
        </div>
        <div style={{display:"flex",alignItems:"flex-end",gap:14,height:170,overflowX:"auto",paddingBottom:8}}>
          {stats.map(b=>{
            const altoPrestado=Math.max((b.prestado/maxValor)*140,b.prestado>0?4:0);
            const altoInteres=Math.max((b.interes/maxValor)*140,b.interes>0?4:0);
            return <div key={b.clave} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:72}}>
              <div style={{display:"flex",alignItems:"flex-end",gap:4,height:140}}>
                <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                  <div style={{fontSize:9,color:"#2563eb",fontWeight:600,marginBottom:2}}>{fmt(b.prestado).replace("US$","$")}</div>
                  <div style={{width:22,height:altoPrestado,background:"#2563eb",borderRadius:"4px 4px 0 0",opacity:0.85}}/>
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                  <div style={{fontSize:9,color:"#d97706",fontWeight:600,marginBottom:2}}>{fmt(b.interes).replace("US$","$")}</div>
                  <div style={{width:22,height:altoInteres,background:"#d97706",borderRadius:"4px 4px 0 0",opacity:0.85}}/>
                </div>
              </div>
              <div style={{fontSize:9,color:"#64748b",marginTop:4,textAlign:"center",lineHeight:1.2}}>{b.etiqueta}</div>
            </div>;
          })}
        </div>
      </div>
      <div style={{overflowX:"auto"}}><table style={s.tabla}>
        <thead><tr>{["Quincena","Prestado","Interés generado","Prestado acumulado"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
        <tbody>{[...stats].reverse().map(b=><tr key={b.clave}>
          <td style={s.td}>{b.etiqueta}</td>
          <td style={{...s.td,color:"#2563eb",fontWeight:600}}>{fmt(b.prestado)}</td>
          <td style={{...s.td,color:"#d97706",fontWeight:600}}>{fmt(b.interes)}</td>
          <td style={s.td}>{fmt(b.acumulado)}</td>
        </tr>)}</tbody>
      </table></div>
    </>}
  </>;
}

function Reportes({datos}){
  const provMap=Object.fromEntries(datos.proveedores.map(p=>[p.id,p]));

  // Agrupar ganancias por mes
  const gananciaPorMes={};
  datos.pagos.forEach(pg=>{
    const mes=pg.fecha.substring(0,7); // YYYY-MM
    if(!gananciaPorMes[mes]) gananciaPorMes[mes]={mes,gananciaJorge:0,total:0,pagos:0};
    gananciaPorMes[mes].gananciaJorge+=pg.gananciaJorge||0;
    gananciaPorMes[mes].total+=pg.monto||0;
    gananciaPorMes[mes].pagos+=1;
  });
  const meses=Object.values(gananciaPorMes).sort((a,b)=>a.mes.localeCompare(b.mes));
  const maxGanancia=Math.max(...meses.map(m=>m.gananciaJorge),1);

  // Ganancias por proveedor
  const gananciaPorProv={};
  datos.pagos.forEach(pg=>{
    const pr=datos.prestamos.find(x=>x.id===pg.prestamoId);
    if(!pr) return;
    const pid=pr.proveedor;
    if(!gananciaPorProv[pid]) gananciaPorProv[pid]={nombre:provMap[pid]?.nombre||"—",ganancia:0};
    gananciaPorProv[pid].ganancia+=pg.gananciaJorge||0;
  });
  const porProv=Object.values(gananciaPorProv).sort((a,b)=>b.ganancia-a.ganancia);

  const totalGanancia=meses.reduce((s,m)=>s+m.gananciaJorge,0);
  const totalCobrado=meses.reduce((s,m)=>s+m.total,0);
  const mejorMes=meses.length>0?meses.reduce((a,b)=>a.gananciaJorge>b.gananciaJorge?a:b):null;

  const nombreMes=(m)=>{
    const [anio,mes]=m.split("-");
    const nombres=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    return `${nombres[parseInt(mes)-1]} ${anio}`;
  };

  return <div>
    <h2 style={s.h2}>Reportes y ganancias</h2>

    <div style={s.cards}>
      <Tarjeta titulo="Ganancia total acumulada" valor={fmt(totalGanancia)} color="#7c3aed"/>
      <Tarjeta titulo="Total cobrado"            valor={fmt(totalCobrado)}  color="#2563eb"/>
      <Tarjeta titulo="Pagos registrados"        valor={datos.pagos.length} color="#059669"/>
      <Tarjeta titulo="Mejor mes"                valor={mejorMes?nombreMes(mejorMes.mes):"—"} color="#d97706"/>
    </div>

    {meses.length===0?<p style={s.empty}>No hay pagos registrados todavía.</p>:<>

      <h3 style={s.h3}>Ganancia mensual</h3>
      <div style={{background:"#fff",borderRadius:10,padding:16,boxShadow:"0 1px 3px rgba(0,0,0,.07)",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"flex-end",gap:8,height:160,overflowX:"auto",paddingBottom:8}}>
          {meses.map((m,i)=>{
            const altura=Math.max((m.gananciaJorge/maxGanancia)*140,4);
            return <div key={m.mes} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:48}}>
              <div style={{fontSize:10,color:"#7c3aed",fontWeight:600,marginBottom:2}}>{fmt(m.gananciaJorge).replace("US$","$")}</div>
              <div style={{width:36,height:altura,background:"#7c3aed",borderRadius:"4px 4px 0 0",opacity:0.85}}/>
              <div style={{fontSize:9,color:"#64748b",marginTop:4,textAlign:"center",lineHeight:1.2}}>{nombreMes(m.mes)}</div>
            </div>;
          })}
        </div>
      </div>

      <h3 style={s.h3}>Detalle por mes</h3>
      <div style={{overflowX:"auto"}}><table style={s.tabla}>
        <thead><tr>{["Mes","Pagos","Total cobrado","Tu ganancia"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
        <tbody>{[...meses].reverse().map(m=><tr key={m.mes}>
          <td style={s.td}>{nombreMes(m.mes)}</td>
          <td style={s.td}>{m.pagos}</td>
          <td style={s.td}>{fmt(m.total)}</td>
          <td style={{...s.td,color:"#7c3aed",fontWeight:600}}>{fmt(m.gananciaJorge)}</td>
        </tr>)}</tbody>
      </table></div>

      {porProv.length>0 && <>
        <h3 style={s.h3}>Ganancia por proveedor</h3>
        <div style={{overflowX:"auto"}}><table style={s.tabla}>
          <thead><tr>{["Proveedor","Tu ganancia total"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
          <tbody>{porProv.map(p=><tr key={p.nombre}>
            <td style={s.td}>{p.nombre}</td>
            <td style={{...s.td,color:"#7c3aed",fontWeight:600}}>{fmt(p.ganancia)}</td>
          </tr>)}</tbody>
        </table></div>
      </>}

      {/* Crecimiento por proveedor, quincena a quincena */}
      {(()=>{
        const nombresMesQ=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
        const bucketQuincena=(fechaStr)=>{
          const [a,m,d]=fechaStr.split("-").map(Number);
          let ini,fin;
          if(d>=15&&d<30){ini=new Date(a,m-1,15);fin=new Date(a,m-1,29);}
          else if(d>=30){ini=new Date(a,m-1,30);fin=new Date(a,m,14);}
          else {ini=new Date(a,m-2,30);fin=new Date(a,m-1,14);}
          const clave=ini.toISOString().split("T")[0];
          const etiqueta=ini.getDate()+" "+nombresMesQ[ini.getMonth()]+" – "+fin.getDate()+" "+nombresMesQ[fin.getMonth()];
          return {clave,etiqueta};
        };
        return <ProveedorCrecimiento datos={datos} provMap={provMap} bucketQuincena={bucketQuincena} fmt={fmt} s={s}/>;
      })()}

      {/* Resumen anual */}
      {(()=>{
        const anios={};
        datos.prestamos.forEach(p=>{
          if(!p.fechaInicio) return;
          const a=p.fechaInicio.substring(0,4);
          if(!anios[a]) anios[a]={prestado:0,cobrado:0,interes:0,capital:0,ganancia:0,nPrestamos:0,nPagos:0};
          anios[a].prestado+=(p.capitalInicial||0);
          anios[a].nPrestamos++;
        });
        datos.pagos.forEach(pg=>{
          if(!pg.fecha) return;
          const a=pg.fecha.substring(0,4);
          if(!anios[a]) anios[a]={prestado:0,cobrado:0,interes:0,capital:0,ganancia:0,nPrestamos:0,nPagos:0};
          anios[a].cobrado+=(pg.monto||0);
          anios[a].interes+=(pg.interesAplicado||0);
          anios[a].capital+=(pg.capitalAplicado||0);
          anios[a].ganancia+=(pg.gananciaJorge||0);
          anios[a].nPagos++;
        });
        const lista=Object.entries(anios).sort((a,b)=>b[0].localeCompare(a[0]));
        if(lista.length===0) return null;
        return <>
          <h3 style={s.h3}>Resumen anual</h3>
          {lista.map(([anio,d])=><div key={anio} style={{background:"#fff",borderRadius:10,padding:16,marginBottom:12,boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:10,color:"#1e293b"}}>Año {anio}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10}}>
              <div><div style={{fontSize:11,color:"#64748b"}}>Prestado</div><div style={{fontSize:15,fontWeight:700,color:"#2563eb"}}>{fmt(d.prestado)}</div><div style={{fontSize:10,color:"#94a3b8"}}>{d.nPrestamos} préstamos</div></div>
              <div><div style={{fontSize:11,color:"#64748b"}}>Cobrado</div><div style={{fontSize:15,fontWeight:700,color:"#059669"}}>{fmt(d.cobrado)}</div><div style={{fontSize:10,color:"#94a3b8"}}>{d.nPagos} pagos</div></div>
              <div><div style={{fontSize:11,color:"#64748b"}}>Interés cobrado</div><div style={{fontSize:15,fontWeight:700,color:"#d97706"}}>{fmt(d.interes)}</div></div>
              <div><div style={{fontSize:11,color:"#64748b"}}>Capital recuperado</div><div style={{fontSize:15,fontWeight:700,color:"#0891b2"}}>{fmt(d.capital)}</div></div>
              <div><div style={{fontSize:11,color:"#64748b"}}>Tu ganancia</div><div style={{fontSize:17,fontWeight:700,color:"#7c3aed"}}>{fmt(d.ganancia)}</div></div>
            </div>
          </div>)}
        </>;
      })()}

      {/* Historial por quincena */}
      {(()=>{
        const quincenas={};
        datos.pagos.forEach(pg=>{
          if(!pg.fecha) return;
          const [y,m,d]=pg.fecha.split("-");
          const q=parseInt(d)<=15?`${y}-${m}-Q1`:`${y}-${m}-Q2`;
          const label=parseInt(d)<=15?`1-15 ${nombreMes(y+"-"+m)}`:`16-30 ${nombreMes(y+"-"+m)}`;
          if(!quincenas[q]) quincenas[q]={label,cobrado:0,interes:0,capital:0,ganancia:0,pagos:0};
          quincenas[q].cobrado+=(pg.monto||0);
          quincenas[q].interes+=(pg.interesAplicado||0);
          quincenas[q].capital+=(pg.capitalAplicado||0);
          quincenas[q].ganancia+=(pg.gananciaJorge||0);
          quincenas[q].pagos+=1;
        });
        const lista=Object.entries(quincenas).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>v);
        if(lista.length===0) return null;
        return <>
          <h3 style={s.h3}>Historial por quincena</h3>
          <div style={{overflowX:"auto"}}><table style={s.tabla}>
            <thead><tr>{["Quincena","Pagos","Cobrado","Interés","Capital","Tu ganancia"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
            <tbody>{lista.map((q,i)=><tr key={i}>
              <td style={s.td}>{q.label}</td>
              <td style={s.td}>{q.pagos}</td>
              <td style={s.td}>{fmt(q.cobrado)}</td>
              <td style={s.td}>{fmt(q.interes)}</td>
              <td style={s.td}>{fmt(q.capital)}</td>
              <td style={{...s.td,color:"#7c3aed",fontWeight:600}}>{fmt(q.ganancia)}</td>
            </tr>)}</tbody>
          </table></div>
        </>;
      })()}
    </>}
  </div>;
}

function Actividad(){
  const [accesos,setAccesos]=React.useState(null);

  React.useEffect(()=>{
    const cargar=async()=>{
      try{
        // Cargar últimos 50 accesos usando la API de compat o modular
        const registros=[];
        // Intentar con la API modular de Firestore
        const {collection,getDocs,query,orderBy,limit}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
        const q=query(collection(window._db,"accesos"),orderBy("fecha","desc"),limit(50));
        const snap=await getDocs(q);
        snap.forEach(doc=>registros.push(doc.data()));
        setAccesos(registros);
      }catch(e){
        console.error("Error cargando accesos:",e);
        setAccesos([]);
      }
    };
    cargar();
  },[]);

  if(accesos===null) return <div style={{padding:20,textAlign:"center",color:"#64748b"}}>Cargando registro de actividad...</div>;

  return <div>
    <h2 style={s.h2}>Registro de actividad</h2>
    <p style={{color:"#64748b",fontSize:13,marginBottom:14}}>Últimos 50 accesos a la app</p>
    {accesos.length===0?<p style={s.empty}>No hay accesos registrados todavía.</p>:
      <div style={{overflowX:"auto"}}><table style={s.tabla}>
        <thead><tr>{["Fecha y hora","Rol","Usuario","Dispositivo"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
        <tbody>{accesos.map((a,i)=>{
          const fecha=new Date(a.fecha);
          const rolColor=a.rol==="admin"?"#2563eb":a.rol==="proveedor"?"#059669":"#7c3aed";
          return <tr key={i}>
            <td style={s.td}>{fecha.toLocaleString("es-PA")}</td>
            <td style={s.td}><span style={{padding:"2px 8px",borderRadius:99,fontSize:11,fontWeight:600,background:rolColor+"20",color:rolColor}}>{a.rol}</span></td>
            <td style={s.td}>{a.identificador}</td>
            <td style={{...s.td,fontSize:11,color:"#94a3b8"}}>{(a.dispositivo||"").substring(0,40)}...</td>
          </tr>;
        })}</tbody>
      </table></div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
