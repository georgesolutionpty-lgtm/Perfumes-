const proximaQuincena = (fecha) => {
  const d = new Date(fecha+"T00:00:00");
  const anio=d.getFullYear(), mes=d.getMonth(), dia=d.getDate();
  if(dia<15) return `${anio}-${String(mes+1).padStart(2,"0")}-15`;
  if(dia<30) return `${anio}-${String(mes+1).padStart(2,"0")}-30`;
  const sig=new Date(anio,mes+1,15);
  return `${sig.getFullYear()}-${String(sig.getMonth()+1).padStart(2,"0")}-15`;
};

// Combina un arreglo (clientes, prestamos, pagos, proveedores) por "id",
// usando: baseline = lo último que este dispositivo sabía que estaba sincronizado,
// local = lo que este dispositivo tiene ahora (con el cambio que se quiere guardar),
// remoto = lo que hay en Firebase justo antes de guardar (puede tener cambios de otro dispositivo).
// Si un registro cambió localmente respecto al baseline, gana el local.
// Si no cambió localmente pero sí cambió en remoto, gana el remoto.
// Si se borró localmente y nadie más lo tocó en remoto, se borra.
function normalizarValor(v){
  if(v===undefined||v===null||v==="") return null;
  if(typeof v==="number") return Math.round(v*1e6)/1e6; // evita falsos positivos por redondeo flotante
  if(typeof v==="string"){
    const n=Number(v);
    if(!isNaN(n) && v.trim()!=="") return Math.round(n*1e6)/1e6;
    return v.trim();
  }
  if(typeof v==="object") return JSON.stringify(v);
  return v;
}
function objetosIguales(a,b){
  if(a===b) return true;
  if(!a||!b) return false;
  const campos=new Set([...Object.keys(a),...Object.keys(b)]);
  for(const c of campos){ if(normalizarValor(a[c])!==normalizarValor(b[c])) return false; }
  return true;
}

function mergeArrayPorId(baseline,local,remoto){
  baseline=baseline||[]; local=local||[]; remoto=remoto||[];
  // Si los elementos no tienen "id" (ej. movimientos del fondo mutuo), se usa
  // el contenido completo como clave: así nunca se pierde un registro nuevo,
  // y los duplicados idénticos no se repiten.
  const clave=x=>(x&&x.id!==undefined)?x.id:JSON.stringify(x);
  const baseMap=new Map(baseline.map(x=>[clave(x),x]));
  const remMap=new Map(remoto.map(x=>[clave(x),x]));
  const locMap=new Map(local.map(x=>[clave(x),x]));
  const resultMap=new Map(remMap);

  for(const [id,item] of locMap){
    const enBase=baseMap.get(id);
    const cambioLocal=!enBase || !objetosIguales(enBase,item);
    if(cambioLocal) resultMap.set(id,item);
  }
  for(const [id] of baseMap){
    if(!locMap.has(id)){
      const remItem=remMap.get(id);
      const baseItem=baseMap.get(id);
      if(!remItem || objetosIguales(remItem,baseItem)){
        resultMap.delete(id); // borrado local confirmado: nadie más lo cambió mientras tanto (o ya no existe)
      }
      // si remoto ya lo cambió distinto al baseline, lo dejamos (no perder el cambio de otro dispositivo)
    }
  }
  return Array.from(resultMap.values());
}

// Fusión completa de "datos" antes de guardar: evita que un dispositivo borre
// cambios hechos por otro entre la última carga y este guardado.
function mergeDatosParaGuardar(baseline,local,remoto){
  if(!remoto) return local; // no había nada en el servidor todavía
  if(!baseline) baseline=remoto;
  const merged={
    ...remoto,
    proveedores: mergeArrayPorId(baseline.proveedores,local.proveedores,remoto.proveedores),
    clientes: mergeArrayPorId(baseline.clientes,local.clientes,remoto.clientes),
    prestamos: mergeArrayPorId(baseline.prestamos,local.prestamos,remoto.prestamos),
    pagos: mergeArrayPorId(baseline.pagos,local.pagos,remoto.pagos),
    fondoMutuo:{
      saldoMilixa: (JSON.stringify(baseline.fondoMutuo?.saldoMilixa)!==JSON.stringify(local.fondoMutuo?.saldoMilixa))
        ? local.fondoMutuo?.saldoMilixa : remoto.fondoMutuo?.saldoMilixa,
      saldoJorge: (JSON.stringify(baseline.fondoMutuo?.saldoJorge)!==JSON.stringify(local.fondoMutuo?.saldoJorge))
        ? local.fondoMutuo?.saldoJorge : remoto.fondoMutuo?.saldoJorge,
      movimientos: mergeArrayPorId(baseline.fondoMutuo?.movimientos,local.fondoMutuo?.movimientos,remoto.fondoMutuo?.movimientos)
    }
  };
  return merged;
}

async function cargarDeFirebase(){
  try{
    const snap=await window._fbGetDoc(window._fbDoc(window._db,"creditosApp","datos"));
    return snap.exists()?snap.data():null;
  }catch(e){console.error("Error cargando:",e); return null;}
}

async function crearBackupAutomatico(datos){
  try{
    const fecha=hoy();
    const backupId="backup_"+fecha;
    // Solo crear backup si no existe uno de hoy
    const snap=await window._fbGetDoc(window._fbDoc(window._db,"backups",backupId));
    if(!snap.exists()){
      await window._fbSetDoc(window._fbDoc(window._db,"backups",backupId),{
        ...datos,
        fechaBackup: fecha,
        horaBackup: new Date().toLocaleTimeString("es-PA")
      });
      console.log("Backup automático creado:",backupId);
    }
  }catch(e){console.error("Error en backup:",e);}
}

const ADMIN_PASSWORD = "prestjrc2024";

function Login({onLogin,datos}){
  const [pass,setPass]=React.useState("");
  const [cedula,setCedula]=React.useState("");
  const [modo,setModo]=React.useState("admin"); // admin o cliente
  const [error,setError]=React.useState("");

  const registrarAcceso=async(rol,identificador)=>{
    try{
      const fecha=new Date().toISOString();
      const id="acceso_"+Date.now();
      await window._fbSetDoc(window._fbDoc(window._db,"accesos",id),{
        rol,identificador,fecha,
        dispositivo:navigator.userAgent.substring(0,80)
      });
    }catch(e){console.error("Error registrando acceso:",e);}
  };

  const entrar=()=>{
    setError("");
    if(modo==="admin"){
      if(pass===ADMIN_PASSWORD){registrarAcceso("admin","administrador");onLogin({rol:"admin"});}
      else{setError("Contraseña incorrecta");}
    } else if(modo==="proveedor"){
      if(!cedula.trim()){setError("Ingresá tu nombre");return;}
      if(!datos){setError("Cargando datos… intentá de nuevo en unos segundos");return;}
      const nombreIn=cedula.trim().toLowerCase();
      const prov=datos.proveedores.find(p=>p.nombre.toLowerCase()===nombreIn)
        || datos.proveedores.find(p=>p.nombre.toLowerCase().includes(nombreIn));
      if(!prov){setError("Proveedor no encontrado");return;}
      if(prov.clave && String(prov.clave).trim().toLowerCase()!==pass.trim().toLowerCase()){setError("Clave incorrecta. Revisala en Admin → Proveedores (columna Clave).");return;}
      registrarAcceso("proveedor",prov.nombre);
      onLogin({rol:"proveedor",nombre:prov.nombre,proveedorId:prov.id});
    } else {
      if(!cedula.trim()){setError("Ingresá tu cédula");return;}
      registrarAcceso("cliente",cedula.trim());
      onLogin({rol:"cliente",cedula:cedula.trim()});
    }
  };

  return <div style={{minHeight:"100vh",background:"#1e293b",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"#fff",borderRadius:16,padding:28,width:"100%",maxWidth:360,boxShadow:"0 8px 32px rgba(0,0,0,.3)"}}>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:36,marginBottom:8}}>💰</div>
        <h1 style={{fontSize:22,fontWeight:700,color:"#1e293b"}}>PrestJRC</h1>
        <p style={{color:"#64748b",fontSize:13}}>Gestión de préstamos</p>
      </div>
      <div style={{display:"flex",gap:0,marginBottom:20,background:"#f1f5f9",borderRadius:8,padding:3}}>
        <button onClick={()=>{setModo("admin");setError("");setPass("");}} style={{flex:1,padding:"7px 4px",border:"none",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:12,background:modo==="admin"?"#fff":"transparent",color:modo==="admin"?"#2563eb":"#64748b",boxShadow:modo==="admin"?"0 1px 3px rgba(0,0,0,.1)":"none"}}>Admin</button>
        <button onClick={()=>{setModo("proveedor");setError("");setPass("");}} style={{flex:1,padding:"7px 4px",border:"none",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:12,background:modo==="proveedor"?"#fff":"transparent",color:modo==="proveedor"?"#059669":"#64748b",boxShadow:modo==="proveedor"?"0 1px 3px rgba(0,0,0,.1)":"none"}}>Proveedor</button>
        <button onClick={()=>{setModo("cliente");setError("");}} style={{flex:1,padding:"7px 4px",border:"none",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:12,background:modo==="cliente"?"#fff":"transparent",color:modo==="cliente"?"#7c3aed":"#64748b",boxShadow:modo==="cliente"?"0 1px 3px rgba(0,0,0,.1)":"none"}}>Cliente</button>
      </div>
      {modo==="admin" && <div>
        <label style={{fontSize:12,color:"#475569",fontWeight:600}}>Contraseña</label>
        <input type="password" style={{width:"100%",padding:"10px 12px",border:"1px solid #e2e8f0",borderRadius:8,fontSize:14,marginTop:4,marginBottom:12,boxSizing:"border-box"}} placeholder="Contraseña de administrador" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()}/>
      </div>}
      {modo==="proveedor" && <div>
        <label style={{fontSize:12,color:"#475569",fontWeight:600}}>Tu nombre (como aparece en el sistema)</label>
        <input type="text" style={{width:"100%",padding:"10px 12px",border:"1px solid #e2e8f0",borderRadius:8,fontSize:14,marginTop:4,marginBottom:12,boxSizing:"border-box"}} placeholder="Ej: Milixa Yariela" value={cedula} onChange={e=>setCedula(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()}/>
        <label style={{fontSize:12,color:"#475569",fontWeight:600}}>Tu clave (solo si te asignaron una)</label>
        <input type="password" style={{width:"100%",padding:"10px 12px",border:"1px solid #e2e8f0",borderRadius:8,fontSize:14,marginTop:4,marginBottom:12,boxSizing:"border-box"}} placeholder="Déjalo vacío si no tienes clave" autoCapitalize="off" autoCorrect="off" spellCheck={false} value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()}/>
      </div>}
      {modo==="cliente" && <div>
        <label style={{fontSize:12,color:"#475569",fontWeight:600}}>Tu número de cédula</label>
        <input type="text" style={{width:"100%",padding:"10px 12px",border:"1px solid #e2e8f0",borderRadius:8,fontSize:14,marginTop:4,marginBottom:12,boxSizing:"border-box"}} placeholder="Ingresá tu cédula" value={cedula} onChange={e=>setCedula(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()}/>
      </div>}
      {error && <p style={{color:"#dc2626",fontSize:13,marginBottom:8,textAlign:"center"}}>{error}</p>}
      <button style={{width:"100%",padding:"11px",background:"#2563eb",color:"#fff",border:"none",borderRadius:8,fontSize:15,fontWeight:700,cursor:"pointer"}} onClick={entrar}>
        Entrar
      </button>
    </div>
  </div>;
}

function VistaProveedor({datos,nombre,proveedorId,actualizar,onLogout}){
  const [tab,setTab]=React.useState("resumen");
  const [clienteSel,setClienteSel]=React.useState("");
  const proveedor=(proveedorId&&datos.proveedores.find(p=>p.id===proveedorId))
    || datos.proveedores.find(p=>p.nombre.toLowerCase().includes(nombre.toLowerCase()));
  if(!proveedor) return <div style={{minHeight:"100vh",background:"#1e293b",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{background:"#fff",borderRadius:16,padding:28,textAlign:"center",maxWidth:340}}>
      <div style={{fontSize:40,marginBottom:12}}>❌</div>
      <h2 style={{marginBottom:8}}>Proveedor no encontrado</h2>
      <p style={{color:"#64748b",marginBottom:16,fontSize:13}}>No encontramos "{nombre}" en el sistema.</p>
      <button onClick={onLogout} style={{padding:"10px 20px",background:"#2563eb",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600}}>Volver</button>
    </div>
  </div>;

  const prestamosActivos=datos.prestamos.filter(p=>p.proveedor===proveedor.id&&p.saldo>0);
  const todosLosPrestamos=datos.prestamos.filter(p=>p.proveedor===proveedor.id);
  const pagos=datos.pagos.filter(pg=>{
    const pr=datos.prestamos.find(x=>x.id===pg.prestamoId);
    return pr&&pr.proveedor===proveedor.id;
  });
  const capitalColocado=prestamosActivos.reduce((s,p)=>s+p.saldo,0);
  const interesGenerado=pagos.reduce((s,pg)=>s+(pg.gananciaProv||0),0);
  const interesPendiente=prestamosActivos.reduce((s,p)=>s+(p.saldo*(proveedor.tasa/100)),0);
  const fmt2=(n)=>new Intl.NumberFormat("es-CR",{style:"currency",currency:"USD"}).format(n||0);

  return <div style={{minHeight:"100vh",background:"#f8fafc"}}>
    <header style={{background:"#1e293b",padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span style={{color:"#fff",fontWeight:700,fontSize:18}}>💰 PrestJRC</span>
      <button onClick={onLogout} style={{padding:"5px 12px",background:"#334155",color:"#fff",border:"none",borderRadius:5,fontSize:12,cursor:"pointer"}}>Salir</button>
    </header>
    <div style={{padding:"16px 12px",maxWidth:700,margin:"0 auto"}}>
      <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
        {[["resumen","📊 Resumen"],["prestamo","💵 Nuevo préstamo"],["pago","✅ Registrar pago"],["cliente","👤 Clientes"]].map(([id,label])=>
          <button key={id} onClick={()=>setTab(id)} style={{padding:"8px 12px",border:"none",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",background:tab===id?"#2563eb":"#e2e8f0",color:tab===id?"#fff":"#334155"}}>{label}</button>)}
      </div>
      {tab==="prestamo" && <ProvNuevoPrestamo datos={datos} proveedor={proveedor} actualizar={actualizar} clienteSel={clienteSel} setClienteSel={setClienteSel} irAClientes={()=>setTab("cliente")}/>}
      {tab==="pago" && <ProvRegistrarPago datos={datos} proveedor={proveedor} actualizar={actualizar}/>}
      {tab==="cliente" && <ProvClientes datos={datos} proveedor={proveedor} actualizar={actualizar} setClienteSel={setClienteSel} irAPrestamo={()=>setTab("prestamo")}/>}
      {tab==="resumen" && <div>
      <h2 style={{fontSize:18,fontWeight:700,marginBottom:4}}>Bienvenido, {proveedor.nombre}</h2>
      <p style={{color:"#64748b",fontSize:13,marginBottom:16}}>Tu cartera en PrestJRC</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:20}}>
        <div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 3px rgba(0,0,0,.07)",borderTop:"4px solid #2563eb"}}>
          <div style={{fontSize:16,fontWeight:700,color:"#2563eb"}}>{fmt2(capitalColocado)}</div>
          <div style={{fontSize:11,color:"#64748b"}}>Capital colocado</div>
        </div>
        <div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 3px rgba(0,0,0,.07)",borderTop:"4px solid #f59e0b"}}>
          <div style={{fontSize:16,fontWeight:700,color:"#f59e0b"}}>{fmt2(interesPendiente)}</div>
          <div style={{fontSize:11,color:"#64748b"}}>Interés pendiente</div>
        </div>
        <div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 3px rgba(0,0,0,.07)",borderTop:"4px solid #059669"}}>
          <div style={{fontSize:16,fontWeight:700,color:"#059669"}}>{fmt2(interesGenerado)}</div>

          <thead><tr>{["Cliente","Saldo","Tasa","Mi interés","Próx. pago"].map(h=><th key={h} style={{background:"#f1f5f9",padding:"9px 10px",textAlign:"left",fontWeight:600,color:"#475569",fontSize:11}}>{h}</th>)}</tr></thead>

              <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{proveedor.tasa}%</td>
              <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9",color:"#059669",fontWeight:600}}>{fmt2(p.saldo*(proveedor.tasa/100))}</td>
              <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{p.proximoPago}</td>
            </tr>;
          })}</tbody>

      <h3 style={{fontSize:14,fontWeight:600,margin:"0 0 10px",color:"#475569"}}>Historial de pagos recibidos</h3>
      {pagos.length===0?<p style={{color:"#94a3b8"}}>Sin pagos registrados.</p>:
        <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",background:"#fff",borderRadius:10,overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,.07)",fontSize:13}}>
          <thead><tr>{["Fecha","Cliente","Capital","Mi interés","Total recibido"].map(h=><th key={h} style={{background:"#f1f5f9",padding:"9px 10px",textAlign:"left",fontWeight:600,color:"#475569",fontSize:11}}>{h}</th>)}</tr></thead>
          <tbody>{[...pagos].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(pg=>{
            const pr=datos.prestamos.find(x=>x.id===pg.prestamoId);
            const cl=datos.clientes.find(c=>c.id===pr?.clienteId);
            return <tr key={pg.id}>
              <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{pg.fecha}</td>
              <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{cl?.nombre||"—"}</td>
              <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{fmt2(pg.capitalAplicado)}</td>
              <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9",color:"#059669",fontWeight:600}}>{fmt2(pg.gananciaProv)}</td>
              <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9",fontWeight:600}}>{fmt2((pg.capitalAplicado||0)+(pg.gananciaProv||0))}</td>
            </tr>;
          })}</tbody>
        </table></div>}
      </div>}
    </div>
  </div>;
}

const provFmt=(n)=>new Intl.NumberFormat("es-CR",{style:"currency",currency:"USD"}).format(n||0);
const provInput={width:"100%",padding:"10px 12px",border:"1px solid #e2e8f0",borderRadius:8,fontSize:14,boxSizing:"border-box",marginBottom:10};
const provBtn={width:"100%",padding:"12px",background:"#059669",color:"#fff",border:"none",borderRadius:8,fontSize:15,fontWeight:700,cursor:"pointer"};
const provCard={background:"#fff",borderRadius:10,padding:16,boxShadow:"0 1px 3px rgba(0,0,0,.07)"};

function ProvNuevoPrestamo({datos,proveedor,actualizar,clienteSel,setClienteSel,irAClientes}){
  const [buscar,setBuscar]=React.useState("");
  const [monto,setMonto]=React.useState("");
  const [fecha,setFecha]=React.useState(hoy());
  const [msg,setMsg]=React.useState("");
  const [bloqueado,setBloqueado]=React.useState(false);
  const cl=datos.clientes.find(c=>c.id===clienteSel);
  const q=buscar.trim().toLowerCase();
  const lista=q?datos.clientes.filter(c=>c.nombre.toLowerCase().includes(q)||(c.cedula&&c.cedula.includes(q))).slice(0,20):[];
  const registrar=()=>{
    if(bloqueado) return;
    const capital=parseFloat(monto);
    if(!cl){setMsg("⚠ Elegí un cliente primero");return;}
    if(!capital||capital<=0){setMsg("⚠ Ingresá un monto válido");return;}
    if(cl.categoria==="no_prestar"){alert("⛔ Este cliente no puede recibir más préstamos. Consultá con el administrador.");return;}
    if(cl.categoria==="riesgo"&&!confirm("🔴 Atención: "+cl.nombre+" está categorizado como RIESGO.\n\n¿Continuar con el préstamo?")) return;
    if(!confirm("¿Registrar préstamo de "+provFmt(capital)+" a "+cl.nombre+"?")) return;
    setBloqueado(true); setTimeout(()=>setBloqueado(false),2500);
    actualizar({...datos,prestamos:[...datos.prestamos,{
      id:Date.now().toString(),clienteId:cl.id,proveedor:proveedor.id,
      capitalInicial:capital,saldo:capital,fechaInicio:fecha,proximoPago:proximaQuincena(fecha),
      estado:"activo",tasaCliente:0.15,
      registradoPor:proveedor.nombre,fechaRegistro:new Date().toISOString()
    }]});
    setMsg("✔ Préstamo de "+provFmt(capital)+" registrado a "+cl.nombre);
    setMonto("");setClienteSel("");setBuscar("");
  };
  return <div style={provCard}>
    <h3 style={{margin:"0 0 12px",fontSize:16}}>Nuevo préstamo</h3>
    {cl
      ? <div style={{background:"#dcfce7",borderRadius:8,padding:"10px 12px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <b style={{color:"#166534"}}>{cl.nombre}</b>
          <button onClick={()=>setClienteSel("")} style={{background:"none",border:"none",color:"#166534",cursor:"pointer",fontSize:13}}>cambiar</button>
        </div>
      : <>
          <input style={provInput} placeholder="🔍 Buscar cliente por nombre o cédula..." value={buscar} onChange={e=>setBuscar(e.target.value)}/>
          {q && lista.length===0 && <p style={{fontSize:13,color:"#92400e",background:"#fef9c3",padding:"8px 10px",borderRadius:6,marginTop:-4}}>No está registrado. <b style={{cursor:"pointer",textDecoration:"underline"}} onClick={irAClientes}>Agregar cliente nuevo</b></p>}
          {lista.map(c=><div key={c.id} onClick={()=>{setClienteSel(c.id);setBuscar("");setMsg("");}} style={{padding:"10px 12px",border:"1px solid #e2e8f0",borderRadius:8,marginBottom:6,cursor:"pointer",fontSize:14}}>{c.nombre}{c.trabajo?<span style={{color:"#64748b",fontSize:12}}> · {c.trabajo}</span>:null}</div>)}
        </>}
    <input style={provInput} type="number" inputMode="decimal" placeholder="Monto prestado ($)" value={monto} onChange={e=>setMonto(e.target.value)}/>
    <input style={provInput} type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/>
    <button style={{...provBtn,opacity:bloqueado?0.6:1}} onClick={registrar}>Registrar préstamo</button>
    {msg && <p style={{marginTop:10,fontSize:13,color:msg.startsWith("✔")?"#166534":"#b45309",fontWeight:600}}>{msg}</p>}
  </div>;
}

function ProvRegistrarPago({datos,proveedor,actualizar}){
  const [buscar,setBuscar]=React.useState("");
  const [prestamoId,setPrestamoId]=React.useState("");
  const [montoPago,setMontoPago]=React.useState("");
  const [fechaPago,setFechaPago]=React.useState(hoy());
  const [soloCapital,setSoloCapital]=React.useState(false);
  const [msg,setMsg]=React.useState("");
  const [bloqueado,setBloqueado]=React.useState(false);
  const activos=datos.prestamos.filter(p=>p.proveedor===proveedor.id&&p.saldo>0)
    .map(p=>({...p,cliente:datos.clientes.find(c=>c.id===p.clienteId)}))
    .filter(p=>!buscar||(p.cliente?.nombre||"").toLowerCase().includes(buscar.toLowerCase()));
  const p=datos.prestamos.find(x=>x.id===prestamoId&&x.proveedor===proveedor.id);
  const cliente=p?datos.clientes.find(c=>c.id===p.clienteId):null;

  // mismo cálculo que usa el administrador
  const calc=()=>{
    const pago=parseFloat(montoPago);
    if(!p||!pago||pago<=0) return null;
    const tc=p.tasaCliente||0.15, tasaProv=proveedor.tasa/100;
    const ahora=new Date(), prox=new Date(p.proximoPago+"T00:00:00");
    let extras=0;
    if(ahora>prox){
      let cursor=new Date(prox);
      while(extras<=24){
        const d=cursor.getDate(); let sig;
        if(d<15) sig=new Date(cursor.getFullYear(),cursor.getMonth(),15);
        else if(d<30) sig=new Date(cursor.getFullYear(),cursor.getMonth(),30);
        else sig=new Date(cursor.getFullYear(),cursor.getMonth()+1,15);
        if(sig<=ahora){extras++;cursor=sig;} else break;
      }
    }
    const totales=1+extras;
    const interesTotal=soloCapital?0:p.saldo*tc*totales;
    const interesAplicado=soloCapital?0:Math.min(pago,interesTotal);
    const capitalAplicado=soloCapital?pago:Math.max(0,pago-interesTotal);
    const nuevoSaldo=Math.max(0,p.saldo-capitalAplicado);
    return {pago,tc,interesTotal,interesAplicado,capitalAplicado,nuevoSaldo,totales,
      gananciaJorge:soloCapital?0:p.saldo*(tc-tasaProv)*totales,
      gananciaProv:soloCapital?0:p.saldo*tasaProv*totales};
  };
  const d=calc();

  const registrar=()=>{
    if(bloqueado||!d||!p) return;
    if(!confirm("¿Registrar pago de "+provFmt(d.pago)+" de "+(cliente?.nombre||"cliente")+"?")) return;
    setBloqueado(true); setTimeout(()=>setBloqueado(false),2500);
    const pagoId=Date.now().toString();
    const pago={id:pagoId,prestamoId:p.id,fecha:fechaPago,monto:d.pago,interesAplicado:d.interesAplicado,capitalAplicado:d.capitalAplicado,
      saldoAnterior:p.saldo,nuevoSaldo:d.nuevoSaldo,gananciaJorge:d.gananciaJorge,gananciaProv:d.gananciaProv,nota:"",
      proximoPagoAnterior:p.proximoPago,estadoAnterior:p.estado,
      registradoPor:proveedor.nombre};
    const nuevosPrestamos=datos.prestamos.map(pr=>pr.id===p.id?{...pr,saldo:d.nuevoSaldo,estado:d.nuevoSaldo===0?"pagado":"activo",proximoPago:d.nuevoSaldo>0?proximaQuincena(fechaPago):pr.proximoPago}:pr);
    let nf={...datos.fondoMutuo};
    if(proveedor.fondo){
      nf.saldoJorge+=d.gananciaJorge;
      nf.movimientos=[...nf.movimientos,{fecha:fechaPago,tipo:"Interés cobrado",monto:d.interesAplicado,detalle:"Pago de "+(cliente?.nombre||""),pagoId}];
    }
    actualizar({...datos,prestamos:nuevosPrestamos,pagos:[...datos.pagos,pago],fondoMutuo:nf});
    setMsg("✔ Pago de "+provFmt(d.pago)+" registrado ("+(cliente?.nombre||"")+")");
    setPrestamoId("");setMontoPago("");setBuscar("");setSoloCapital(false);
  };

  return <div style={provCard}>
    <h3 style={{margin:"0 0 12px",fontSize:16}}>Registrar pago</h3>
    <input style={provInput} placeholder="🔍 Buscar cliente por nombre..." value={buscar} onChange={e=>setBuscar(e.target.value)}/>
    <select style={provInput} value={prestamoId} onChange={e=>{setPrestamoId(e.target.value);setMsg("");}}>
      <option value="">Seleccionar préstamo ({activos.length})…</option>
      {activos.map(x=><option key={x.id} value={x.id}>{x.cliente?.nombre} — {provFmt(x.saldo)}</option>)}
    </select>
    <input style={provInput} type="number" inputMode="decimal" placeholder="Monto recibido ($)" value={montoPago} onChange={e=>setMontoPago(e.target.value)}/>
    <input style={provInput} type="date" value={fechaPago} onChange={e=>setFechaPago(e.target.value)}/>
    <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#475569",marginBottom:10}}>
      <input type="checkbox" checked={soloCapital} onChange={e=>setSoloCapital(e.target.checked)}/> Solo capital (sin interés)
    </label>
    {d && p && <div style={{background:"#f1f5f9",borderRadius:8,padding:"10px 12px",fontSize:13,marginBottom:10,lineHeight:1.7}}>
      <div>Saldo actual: <b>{provFmt(p.saldo)}</b></div>
      <div>Interés que cubre: <b>{provFmt(d.interesAplicado)}</b></div>
      <div>Abono a capital: <b>{provFmt(d.capitalAplicado)}</b></div>
      <div>Nuevo saldo: <b style={{color:"#059669"}}>{provFmt(d.nuevoSaldo)}</b></div>
    </div>}
    <button style={{...provBtn,opacity:(bloqueado||!d)?0.6:1}} onClick={registrar} disabled={!d}>Registrar pago</button>
    {msg && <p style={{marginTop:10,fontSize:13,color:"#166534",fontWeight:600}}>{msg}</p>}
  </div>;
}

function ProvClientes({datos,proveedor,actualizar,setClienteSel,irAPrestamo}){
  const [buscar,setBuscar]=React.useState("");
  const [nombre,setNombre]=React.useState("");
  const [telefono,setTelefono]=React.useState("");
  const [cedula,setCedula]=React.useState("");
  const [trabajo,setTrabajo]=React.useState("");
  const [direccion,setDireccion]=React.useState("");
  const [msg,setMsg]=React.useState("");
  const [bloqueado,setBloqueado]=React.useState(false);
  const q=buscar.trim().toLowerCase();
  const encontrados=q?datos.clientes.filter(c=>c.nombre.toLowerCase().includes(q)||(c.cedula&&c.cedula.includes(q))).slice(0,20):[];
  const crear=()=>{
    if(bloqueado) return;
    if(!nombre.trim()){setMsg("⚠ El nombre es obligatorio");return;}
    if(cedula.trim()&&datos.clientes.some(c=>c.cedula&&c.cedula.trim()===cedula.trim())){setMsg("⚠ Ya existe un cliente con esa cédula. Búscalo arriba.");return;}
    if(datos.clientes.some(c=>c.nombre.trim().toLowerCase()===nombre.trim().toLowerCase())
       && !confirm("Ya existe un cliente con ese mismo nombre. ¿Crear otro de todas formas?")) return;
    setBloqueado(true); setTimeout(()=>setBloqueado(false),2500);
    const id=Date.now().toString();
    actualizar({...datos,clientes:[...datos.clientes,{
      id,nombre:nombre.trim(),telefono:telefono.trim(),cedula:cedula.trim(),direccion:direccion.trim(),
      trabajo:trabajo.trim(),correo:"",nota:"",categoria:"bueno",
      registradoPor:proveedor.nombre,fechaRegistro:new Date().toISOString()
    }]});
    setClienteSel(id);
    setMsg("✔ Cliente creado");
    setNombre("");setTelefono("");setCedula("");setTrabajo("");setDireccion("");
    irAPrestamo();
  };
  return <div>
    <div style={{...provCard,marginBottom:14}}>
      <h3 style={{margin:"0 0 6px",fontSize:16}}>¿Ya está registrado?</h3>
      <input style={provInput} placeholder="🔍 Buscar por nombre o cédula..." value={buscar} onChange={e=>setBuscar(e.target.value)}/>
      {q && encontrados.length===0 && <p style={{fontSize:13,color:"#92400e",marginTop:-4}}>No aparece. Puedes agregarlo abajo.</p>}
      {encontrados.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",border:"1px solid #e2e8f0",borderRadius:8,marginBottom:6,fontSize:14}}>
        <span>{c.nombre}{c.trabajo?<span style={{color:"#64748b",fontSize:12}}> · {c.trabajo}</span>:null}</span>
        <button onClick={()=>{setClienteSel(c.id);irAPrestamo();}} style={{padding:"5px 10px",background:"#2563eb",color:"#fff",border:"none",borderRadius:6,fontSize:12,cursor:"pointer"}}>Hacer préstamo</button>
      </div>)}
    </div>
    <div style={provCard}>
      <h3 style={{margin:"0 0 12px",fontSize:16}}>Agregar cliente nuevo</h3>
      <input style={provInput} placeholder="Nombre completo *" value={nombre} onChange={e=>setNombre(e.target.value)}/>
      <input style={provInput} placeholder="Teléfono" inputMode="tel" value={telefono} onChange={e=>setTelefono(e.target.value)}/>
      <input style={provInput} placeholder="Cédula" value={cedula} onChange={e=>setCedula(e.target.value)}/>
      <input style={provInput} placeholder="Lugar de trabajo" value={trabajo} onChange={e=>setTrabajo(e.target.value)}/>
      <input style={provInput} placeholder="Dirección" value={direccion} onChange={e=>setDireccion(e.target.value)}/>
      <button style={{...provBtn,opacity:bloqueado?0.6:1}} onClick={crear}>Guardar cliente</button>
      {msg && <p style={{marginTop:10,fontSize:13,color:msg.startsWith("✔")?"#166534":"#b45309",fontWeight:600}}>{msg}</p>}
    </div>
  </div>;
}

function VistaCliente({datos,cedula,onLogout}){
  const cliente=datos.clientes.find(c=>c.cedula===cedula);
  if(!cliente) return <div style={{minHeight:"100vh",background:"#1e293b",display:"flex",alignItems:"center",justifyContent:"center"}}>

  const totalPagado=pagos.reduce((s,pg)=>s+(pg.monto||0),0);

      <h2 style={{fontSize:18,fontWeight:700,marginBottom:4}}>Hola, {cliente.nombre}</h2>
      <p style={{color:"#64748b",fontSize:13,marginBottom:12}}>Este es tu estado de cuenta</p>

        const monto=prompt("¿Cuánto necesitás? Ingresá el monto en dólares:");
        if(!monto||isNaN(parseFloat(monto))||parseFloat(monto)<=0) return;
        try{
          const id="solicitud_"+Date.now();
          await window._fbSetDoc(window._fbDoc(window._db,"solicitudes",id),{
            clienteId:cliente.id,
            clienteNombre:cliente.nombre,
            monto:parseFloat(monto),
            fecha:new Date().toISOString(),
            estado:"pendiente"
          });
          alert("✔ Solicitud enviada. Te contactaremos pronto.");
        }catch(e){
          alert("Error al enviar. Intentá de nuevo.");
        }
      }}>💵 Solicitar nuevo préstamo</button>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        <div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 3px rgba(0,0,0,.07)",borderTop:"4px solid #dc2626"}}>
          <div style={{fontSize:18,fontWeight:700,color:"#dc2626"}}>{fmt(saldoTotal)}</div>
          <div style={{fontSize:11,color:"#64748b"}}>Saldo pendiente</div>
        </div>
        <div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 3px rgba(0,0,0,.07)",borderTop:"4px solid #059669"}}>

          <div style={{fontSize:11,color:"#64748b"}}>Total pagado</div>
        </div>
      </div>
      <h3 style={{fontSize:14,fontWeight:600,margin:"16px 0 10px",color:"#475569"}}>Mis préstamos</h3>

          <thead><tr>{["Capital","Saldo","Interés quincena","Próx. pago","Estado"].map(h=><th key={h} style={{background:"#f1f5f9",padding:"9px 10px",textAlign:"left",fontWeight:600,color:"#475569",fontSize:11}}>{h}</th>)}</tr></thead>

              <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{fmt(p.saldo*tc)}</td>

        <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",background:"#fff",borderRadius:10,overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,.07)",fontSize:13}}>
          <thead><tr>{["Fecha","Monto pagado","Interés","Capital","Saldo"].map(h=><th key={h} style={{background:"#f1f5f9",padding:"9px 10px",textAlign:"left",fontWeight:600,color:"#475569",fontSize:11}}>{h}</th>)}</tr></thead>
          <tbody>{[...pagos].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(pg=><tr key={pg.id}>
            <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{pg.fecha}</td>
            <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{fmt(pg.monto)}</td>
            <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{fmt(pg.interesAplicado)}</td>
            <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{fmt(pg.capitalAplicado)}</td>
            <td style={{padding:"9px 10px",borderTop:"1px solid #f1f5f9"}}>{fmt(pg.nuevoSaldo)}</td>
          </tr>)}</tbody>
        </table></div>}
    </div>
  </div>;
}

function App(){
  const [datos,setDatos]=React.useState(null);
  const ultimoSyncRef=React.useRef(null); // última versión que sabemos coincide con Firebase
  const [vista,setVista]=React.useState("dashboard");
  const [msg,setMsg]=React.useState("⏳ Conectando...");
  const [usuario,setUsuario]=React.useState(null);
  const [solicitudes,setSolicitudes]=React.useState([]);

  React.useEffect(()=>{
    if(!usuario||usuario.rol!=="admin"||!datos) return;
    const cargarSolicitudes=async()=>{
      try{
        const {collection,getDocs}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
        const snap=await getDocs(collection(window._db,"solicitudes"));
        const lista=[];
        snap.forEach(doc=>{
          const d=doc.data();
          if(d.estado==="pendiente") lista.push({docId:doc.id,...d});
        });
        setSolicitudes(lista);
      }catch(e){console.error("Error solicitudes:",e);}
    };
    cargarSolicitudes();
    // Recargar cada 30 segundos
    const intervalo=setInterval(cargarSolicitudes,30000);
    return ()=>clearInterval(intervalo);
  },[usuario,datos]);

  React.useEffect(()=>{
    const cargar=async()=>{
      setMsg("⏳ Conectando...");
      if(!window._firebaseReady){
        await new Promise(r=>window.addEventListener("firebaseReady",r,{once:true}));
      }
      // Siempre cargar desde Firebase primero
      const d=await cargarDeFirebase();
      if(d){
        if(!d.proveedores) d.proveedores=proveedoresIniciales;
        setDatos(d);
        ultimoSyncRef.current=d;
        // Actualizar localStorage con los datos de Firebase
        localStorage.setItem("creditosApp_v3",JSON.stringify(d));
        setMsg("☁ Conectado");
        // Crear backup automático diario
        crearBackupAutomatico(d);
      } else {
        // Solo usar localStorage si Firebase no tiene datos
        try{
          const local=localStorage.getItem("creditosApp_v3");
          if(local){
            const parsed=JSON.parse(local);
            if(!parsed.proveedores) parsed.proveedores=proveedoresIniciales;
            setDatos(parsed);
            ultimoSyncRef.current=parsed;
            await guardarEnFirebase(parsed);
            setMsg("✔ Sincronizado");
          } else {
            const di=datosIniciales();
            setDatos(di);
            ultimoSyncRef.current=di;
            setMsg("☁ Listo");
          }
        }catch{
          const di=datosIniciales();
          setDatos(di);
          ultimoSyncRef.current=di;
          setMsg("☁ Listo");
        }
      }
      setTimeout(()=>setMsg(""),3000);
    };
    cargar();
  },[]);

  // Refresco automático: si otro dispositivo guardó algo, este se entera
  // sin necesidad de recargar la página. No sobrescribe si hay una edición
  // local sin guardar todavía (se combina igual que al guardar).
  React.useEffect(()=>{
    const refrescar=async()=>{
      if(!ultimoSyncRef.current) return;
      try{
        const remoto=await cargarDeFirebase();
        if(!remoto) return;
        if(JSON.stringify(remoto)===JSON.stringify(ultimoSyncRef.current)) return; // nada nuevo
        setDatos(prevLocal=>{
          const fusion=mergeDatosParaGuardar(ultimoSyncRef.current,prevLocal,remoto);
          ultimoSyncRef.current=fusion;
          localStorage.setItem("creditosApp_v3",JSON.stringify(fusion));
          return fusion;
        });
      }catch(e){console.error("Error refrescando:",e);}
    };
    const intervalo=setInterval(refrescar,30000);
    const alVolver=()=>{ if(!document.hidden) refrescar(); };
    document.addEventListener("visibilitychange",alVolver);
    return ()=>{ clearInterval(intervalo); document.removeEventListener("visibilitychange",alVolver); };
  },[]);

  const actualizar=async(nd)=>{
    setDatos(nd); // reflejar el cambio en pantalla de inmediato
    setMsg("⏳ Guardando...");
    try{
      // Antes de escribir, traer la versión más reciente del servidor:
      // puede tener cambios hechos desde otro dispositivo mientras este
      // estaba abierto. Se combinan ambos en vez de sobrescribir todo.
      const remoto=await cargarDeFirebase();
      const fusion=mergeDatosParaGuardar(ultimoSyncRef.current,nd,remoto);
      await guardarEnFirebase(fusion);
      ultimoSyncRef.current=fusion;
      setDatos(fusion);
      localStorage.setItem("creditosApp_v3",JSON.stringify(fusion));
      setMsg("✔ Guardado");
    }catch(e){
      console.error("Error al guardar:",e);
      // Si algo falla, al menos guardamos localmente lo que se alcanzó a hacer
      localStorage.setItem("creditosApp_v3",JSON.stringify(nd));
      setMsg("⚠ No se pudo sincronizar, revisa tu conexión");
    }
    setTimeout(()=>setMsg(""),2000);
  };

  const exportar=()=>{
    const blob=new Blob([JSON.stringify(datos,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`creditosApp_${hoy()}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const exportarExcel=()=>{
    const provMap=Object.fromEntries(datos.proveedores.map(p=>[p.id,p]));
    const wb=XLSX.utils.book_new();

    // Hoja Préstamos
    const prestamosData=datos.prestamos.map(p=>{
      const cl=datos.clientes.find(c=>c.id===p.clienteId);
      const pv=provMap[p.proveedor];
      const tc=p.tasaCliente||0.15;
      return {
        Cliente: cl?.nombre||"—",
        Cedula: cl?.cedula||"—",
        Telefono: cl?.telefono||"—",
        Proveedor: pv?.nombre||"—",
        "Capital inicial": p.capitalInicial||0,
        "Saldo actual": p.saldo||0,
        "Tasa (%)": ((tc)*100).toFixed(1),
        "Interes quincena": (p.saldo*tc).toFixed(2),
        "Fecha inicio": p.fechaInicio||"",
        "Proximo pago": p.proximoPago||"",
        Estado: p.estado||"",
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prestamosData), "Prestamos");

    // Hoja Pagos
    const pagosData=datos.pagos.map(pg=>{
      const pr=datos.prestamos.find(x=>x.id===pg.prestamoId);
      const cl=datos.clientes.find(c=>c.id===pr?.clienteId);
      const pv=provMap[pr?.proveedor];
      return {
        Fecha: pg.fecha,
        Cliente: cl?.nombre||"—",
        Proveedor: pv?.nombre||"—",
        "Monto pagado": pg.monto||0,
        "Interes aplicado": pg.interesAplicado||0,
        "Capital aplicado": pg.capitalAplicado||0,
        "Nuevo saldo": pg.nuevoSaldo||0,
        "Tu ganancia": pg.gananciaJorge||0,
        Nota: pg.nota||"",
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pagosData), "Pagos");

    // Hoja Clientes
    const clientesData=datos.clientes.map(c=>{
      const activos=datos.prestamos.filter(p=>p.clienteId===c.id&&p.saldo>0);
      return {
        Nombre: c.nombre,
        Cedula: c.cedula||"",
        Telefono: c.telefono||"",
        Correo: c.correo||"",
        Direccion: c.direccion||"",
        Trabajo: c.trabajo||"",
        "Prestamos activos": activos.length,
        "Saldo total": activos.reduce((a,p)=>a+p.saldo,0).toFixed(2),
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clientesData), "Clientes");

    // Hoja Proveedores
    const provsData=datos.proveedores.map(p=>{
      const activos=datos.prestamos.filter(x=>x.proveedor===p.id&&x.saldo>0);
      const totalPrestado=activos.reduce((a,x)=>a+x.saldo,0);
      return {
        Nombre: p.nombre,
        "Tasa (%)": p.tasa,
        "Fondo mutuo": p.fondo?"Si":"No",
        "Prestamos activos": activos.length,
        "Total prestado": totalPrestado.toFixed(2),
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(provsData), "Proveedores");

    XLSX.writeFile(wb, `CreditOS_${hoy()}.xlsx`);
  };

  const importar=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{ actualizar(JSON.parse(ev.target.result)); alert("✔ Datos importados."); }
      catch{ alert("Archivo no válido."); }
    };
    reader.readAsText(file); e.target.value="";
  };

  if(!datos) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:12}}>
    <div style={{fontSize:40}}>☁</div>
    <div style={{color:"#64748b",fontSize:15}}>Conectando con la nube...</div>
  </div>;

  if(!usuario) return <Login onLogin={setUsuario} datos={datos}/>;
  if(usuario.rol==="cliente") return <VistaCliente datos={datos} cedula={usuario.cedula} onLogout={()=>setUsuario(null)}/>;
  if(usuario.rol==="proveedor") return <VistaProveedor datos={datos} nombre={usuario.nombre} proveedorId={usuario.proveedorId} actualizar={actualizar} onLogout={()=>setUsuario(null)}/>;

  const tabs=[
    {id:"dashboard",label:"📊 Resumen"},
    {id:"proveedores",label:"🏢 Proveedores"},
    {id:"clientes",label:"👥 Clientes"},
    {id:"prestamos",label:"💵 Préstamos"},
    {id:"pagos",label:"💳 Pagos"},
    {id:"fondo",label:"🏦 Fondo Mutuo"},
    {id:"reportes",label:"📈 Reportes"},
    {id:"actividad",label:"🔐 Actividad"},
  ];

  return <div style={s.app}>
    <header style={s.header}>
      <div style={s.headerInner}>
        <span style={s.logo}>💰 PrestJRC</span>
        <span style={s.subtitle}>Gestión de préstamos</span>
        <div style={s.headerActions}>
          {msg && <span style={s.guardadoMsg}>{msg}</span>}
          <button style={s.btnHeader} onClick={exportar}>⬇ JSON</button>
          <button style={{...s.btnHeader,background:"#166534"}} onClick={exportarExcel}>📊 Excel</button>
          <label style={{...s.btnHeader,display:"inline-block"}}>⬆ Importar
            <input type="file" accept=".json" style={{display:"none"}} onChange={importar}/>
          </label>
        </div>
      </div>
    </header>
    <nav style={s.nav}>
      {tabs.map(t=><button key={t.id} onClick={()=>setVista(t.id)} style={{...s.tab,...(vista===t.id?s.tabActive:{})}}>{t.label}</button>)}
    </nav>
    <main style={s.main}>
      {vista==="dashboard"   && <Dashboard   datos={datos} solicitudes={solicitudes} setSolicitudes={setSolicitudes} actualizar={actualizar}/>}
      {vista==="proveedores" && <Proveedores datos={datos} actualizar={actualizar}/>}
      {vista==="clientes"    && <Clientes    datos={datos} actualizar={actualizar}/>}
      {vista==="prestamos"   && <Prestamos   datos={datos} actualizar={actualizar}/>}
      {vista==="pagos"       && <Pagos       datos={datos} actualizar={actualizar}/>}
      {vista==="fondo"       && <FondoMutuo  datos={datos} actualizar={actualizar}/>}
      {vista==="reportes"    && <Reportes    datos={datos}/>}
      {vista==="actividad"   && <Actividad/>}
    </main>
  </div>;
}

function Dashboard({datos,solicitudes=[],setSolicitudes,actualizar}){
  const provMap=Object.fromEntries(datos.proveedores.map(p=>[p.id,p]));
  const activos=datos.prestamos.filter(p=>p.saldo>0);

  const trabajosDashboard=[...new Set(datos.clientes.map(c=>(c.trabajo||"").trim()).filter(Boolean))].sort();
  const [editandoMeta,setEditandoMeta]=React.useState(false);
  const [metaVal,setMetaVal]=React.useState(datos.metaTotal||7000);
  const totalCartera=activos.reduce((s,p)=>s+p.saldo,0);
  const totalIntereses=activos.reduce((s,p)=>s+p.saldo*(p.tasaCliente||0.15),0);
  const gananciaJorge=activos.reduce((s,p)=>{
    const pv=provMap[p.proveedor]; const tc=p.tasaCliente||0.15;
    return s+(pv?p.saldo*(tc-pv.tasa/100):0);
  },0);
  const proximos=activos.map(p=>({...p,cliente:datos.clientes.find(c=>c.id===p.clienteId)}))
    .filter(p=>p.cliente).sort((a,b)=>new Date(a.proximoPago)-new Date(b.proximoPago)).slice(0,8);
  const porCliente=datos.clientes.map(c=>({nombre:c.nombre,saldo:activos.filter(p=>p.clienteId===c.id).reduce((a,p)=>a+p.saldo,0)}))
    .filter(c=>c.saldo>0).sort((a,b)=>b.saldo-a.saldo);

  const nombreMesCorto=(m)=>{
    const [anio,mes]=m.split("-");
    const nombres=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    return `${nombres[parseInt(mes)-1]} ${anio.slice(2)}`;
  };

  // Mes actual y anterior
  const mesActual=hoy().substring(0,7);
  const d=new Date(); d.setMonth(d.getMonth()-1);
  const mesAnterior=d.toISOString().substring(0,7);

  // Pagos este mes vs mes anterior
  const pagosEsteMes=datos.pagos.filter(p=>p.fecha&&p.fecha.startsWith(mesActual));
  const pagosAnterior=datos.pagos.filter(p=>p.fecha&&p.fecha.startsWith(mesAnterior));
  const cobradoEsteMes=pagosEsteMes.reduce((s,p)=>s+p.monto,0);
  const cobradoAnterior=pagosAnterior.reduce((s,p)=>s+p.monto,0);
  const gananciaEsteMes=pagosEsteMes.reduce((s,p)=>s+(p.gananciaJorge||0),0);
  const interesEsteMes=pagosEsteMes.reduce((s,p)=>s+(p.interesAplicado||0),0);
  const capitalEsteMes=pagosEsteMes.reduce((s,p)=>s+(p.capitalAplicado||0),0);

  // Clientes en mora (próximo pago vencido más de 3 días)
  const ahora=new Date();
  const enMora=activos.map(p=>({...p,cliente:datos.clientes.find(c=>c.id===p.clienteId)}))
    .filter(p=>{
      if(!p.proximoPago) return false;
      const dias=Math.floor((ahora-new Date(p.proximoPago+"T00:00:00"))/(1000*60*60*24));
      return dias>3;
    }).sort((a,b)=>new Date(a.proximoPago)-new Date(b.proximoPago));

  // Deuda a proveedores
  const deudaPorProv=datos.proveedores.map(p=>{
    const total=activos.filter(x=>x.proveedor===p.id).reduce((s,x)=>s+x.saldo,0);
    const interes=activos.filter(x=>x.proveedor===p.id).reduce((s,x)=>s+x.saldo*(p.tasa/100),0);
    return {...p,total,interes};
  }).filter(p=>p.total>0);

  const mesesOrdenados=[...mesesSet].sort();

  const prestadoPorMes=mesesOrdenados.map(mes=>{
    const total=datos.prestamos.filter(p=>p.fechaInicio&&p.fechaInicio.startsWith(mes)).reduce((s,p)=>s+(p.capitalInicial||0),0);
    const porProv={};

      porProv[pv.nombre.split(" ")[0]]=datos.prestamos.filter(p=>p.fechaInicio&&p.fechaInicio.startsWith(mes)&&p.proveedor===pv.id).reduce((s,p)=>s+(p.capitalInicial||0),0);

    const cobrado=datos.pagos.filter(p=>p.fecha&&p.fecha.startsWith(mes)).reduce((s,p)=>s+p.monto,0);

      {solicitudes.map(sol=><div key={sol.docId} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #dbeafe",fontSize:13}}>
        <div>

          <span style={{color:"#64748b",marginLeft:8}}>solicita <b style={{color:"#2563eb"}}>${sol.monto.toFixed(2)}</b></span>
          <div style={{fontSize:11,color:"#94a3b8"}}>{new Date(sol.fecha).toLocaleString("es-PA")}</div>

            setSolicitudes(solicitudes.filter(x=>x.docId!==sol.docId));
          }catch(e){alert("Error");}
        }}>✓ Atendida</button>
      </div>)}

            ?<div style={{display:"flex",gap:6}}>

          }
        </div>
        <div style={{background:"#f1f5f9",borderRadius:99,height:22,overflow:"hidden",position:"relative"}}>
          <div style={{width:`${pctMeta}%`,background:superoMeta?"#7c3aed":"#2563eb",height:"100%",borderRadius:99,transition:"width .3s"}}/>
          <div style={{position:"absolute",top:0,left:0,right:0,bottom:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:pctMeta>45?"#fff":"#1e293b"}}>

      </div>;
    })()}
    {(()=>{
      const hoyStr=new Date().toISOString().split("T")[0];
      const manana=new Date(); manana.setDate(manana.getDate()+1);
      const mananaStr=manana.toISOString().split("T")[0];
      const paganHoy=activos.filter(p=>p.proximoPago===hoyStr||p.proximoPago===mananaStr);
      if(paganHoy.length===0) return null;
      return <div style={{background:"#fffbeb",border:"2px solid #f59e0b",borderRadius:10,padding:14,marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:14,color:"#b45309",marginBottom:8}}>📅 Pagan hoy o mañana ({paganHoy.length} clientes)</div>
        {paganHoy.map(p=>{
          const cl=datos.clientes.find(c=>c.id===p.clienteId);
          const tc=p.tasaCliente||0.15;
          return <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #fde68a",fontSize:13}}>
            <span style={{fontWeight:500}}>{cl?.nombre||"—"}</span>
            <span style={{color:"#d97706"}}>Int: {fmt(p.saldo*tc)} | Saldo: {fmt(p.saldo)}</span>
          </div>;
        })}
      </div>;
    })()}
    {evolucion.length>1 && <>
      <h3 style={s.h3}>Evolución de la cartera</h3>
      <div style={{background:"#fff",borderRadius:10,padding:16,boxShadow:"0 1px 3px rgba(0,0,0,.07)",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"flex-end",gap:6,height:140,overflowX:"auto",paddingBottom:8}}>
          {evolucion.map((e,i)=>{
            const altura=Math.max((e.cartera/maxCartera)*120,4);
            return <div key={e.mes} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:44}}>
              <div style={{fontSize:9,color:"#2563eb",fontWeight:600,marginBottom:2}}>${Math.round(e.cartera)}</div>
              <div style={{width:32,height:altura,background:"#2563eb",borderRadius:"4px 4px 0 0",opacity:0.8}}/>
              <div style={{fontSize:9,color:"#64748b",marginTop:4,textAlign:"center"}}>{nombreMesCorto(e.mes)}</div>
            </div>;
          })}
        </div>
      </div>
    </>}

    {porCliente.length>0 && <>
      <h3 style={s.h3}>Cartera por cliente</h3>
      <div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 3px rgba(0,0,0,.07)",marginBottom:20}}>
        {porCliente.map((c,i)=>{
          const pct=totalCartera>0?((c.saldo/totalCartera)*100).toFixed(1):0;
          const color=COLORES[i%COLORES.length];
          return <div key={c.nombre} style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
              <span style={{fontSize:13,fontWeight:500}}>{c.nombre}</span>
              <span style={{fontSize:13,fontWeight:700,color}}>{fmt(c.saldo)} <span style={{color:"#94a3b8",fontWeight:400}}>({pct}%)</span></span>
            </div>
            <div style={{background:"#f1f5f9",borderRadius:99,height:8,overflow:"hidden"}}>
              <div style={{width:`${pct}%`,background:color,height:"100%",borderRadius:99}}/>
            </div>
          </div>;
        })}
      </div>
    </>}
    <h3 style={s.h3}>Próximos pagos</h3>
    {proximos.length===0?<p style={s.empty}>No hay préstamos activos.</p>:
      <div style={{overflowX:"auto"}}><table style={s.tabla}>
        <thead><tr>{["Cliente","Proveedor","Saldo","Tasa","Interés","Próx. pago"].map(h=><th key={h} style={s.th}>{h}</th>)}</tr></thead>
        <tbody>{proximos.map(p=>{
          const tc=p.tasaCliente||0.15;
          return <tr key={p.id}>
            <td style={s.td}>{p.cliente.nombre}</td>
            <td style={s.td}>{provMap[p.proveedor]?.nombre.split(" ")[0]||"—"}</td>
            <td style={s.td}>{fmt(p.saldo)}</td>
            <td style={s.td}>{(tc*100).toFixed(1)}%</td>
            <td style={s.td}>{fmt(p.saldo*tc)}</td>
            <td style={s.td}>{p.proximoPago}</td>
          </tr>;
        })}</tbody>
      </table></div>}
  </div>;
}

function ProveedorCard({p,sp,pct,color,datos,actualizar}){
  const [pagandoId,setPagandoId]=React.useState(null);
  const [montoPagoInline,setMontoPagoInline]=React.useState("");
  const [soloCapInline,setSoloCapInline]=React.useState(false);
  const [expandido,setExpandido]=React.useState(false);
  const [seleccionados,setSeleccionados]=React.useState([]);
  const [pagadosSesion,setPagadosSesion]=React.useState([]);
  const [marcadosPendientes,setMarcadosPendientes]=React.useState(()=>{
    try{ return JSON.parse(localStorage.getItem("marcados_"+p.id)||"[]"); }catch{ return []; }
  });
  const toggleMarcado=(id)=>{
    const nuevos=marcadosPendientes.includes(id)?marcadosPendientes.filter(x=>x!==id):[...marcadosPendientes,id];
    setMarcadosPendientes(nuevos);
    localStorage.setItem("marcados_"+p.id,JSON.stringify(nuevos));
  };
  const prestamosDelProv=datos.prestamos.filter(x=>x.proveedor===p.id&&x.saldo>0);
  const pagosDelProv=datos.pagos.filter(pg=>{
    const pr=datos.prestamos.find(x=>x.id===pg.prestamoId);
    return pr&&pr.proveedor===p.id;
  });
  const intPend=prestamosDelProv.reduce((s,x)=>s+(x.saldo*(p.tasa/100)),0);
  const mesAct=new Date().toISOString().substring(0,7);
  const intMes=datos.pagos.filter(pg=>{
    const pr=datos.prestamos.find(x=>x.id===pg.prestamoId);
    return pr&&pr.proveedor===p.id&&pg.fecha&&pg.fecha.startsWith(mesAct);
  }).reduce((s,pg)=>s+(pg.gananciaProv||0),0);
  const intTotal=pagosDelProv.reduce((s,pg)=>s+(pg.gananciaProv||0),0);
  // Liquidación: pagos de la quincena de cobro actual (desde el último 15 o 30, hasta hoy)
  const hoyD=new Date();
  const dia=hoyD.getDate();
  let inicioQuincena;
  if(dia>=15&&dia<30){
    inicioQuincena=new Date(hoyD.getFullYear(),hoyD.getMonth(),15);
  } else if(dia>=30){
    inicioQuincena=new Date(hoyD.getFullYear(),hoyD.getMonth(),30);
  } else {
    // dia 1-14: la ronda de cobro empezó el 30 del mes anterior
    inicioQuincena=new Date(hoyD.getFullYear(),hoyD.getMonth()-1,30);
  }
  const strDesde=inicioQuincena.toISOString().split("T")[0];
  const strHasta=hoyD.toISOString().split("T")[0];
  const pagosFiltrados=pagosDelProv.filter(pg=>pg.fecha&&pg.fecha>=strDesde&&pg.fecha<=strHasta);

  return <div style={{background:"#fff",borderRadius:10,padding:14,marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>

      <span style={{fontWeight:600,fontSize:14}}>{p.nombre}</span>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <span style={{fontWeight:700,color,fontSize:15}}>{pct}%</span>
        <span style={{fontSize:16}}>{expandido?"▲":"▼"}</span>
      </div>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#64748b",marginBottom:8}}>
      <span>Prestado: <b style={{color:"#1e293b"}}>{fmt(sp)}</b></span>
      <span>Tasa: <b style={{color:"#1e293b"}}>{p.tasa}%</b></span>
      <span>Activos: <b style={{color:"#1e293b"}}>{prestamosDelProv.length}</b></span>
    </div>
    <div style={{background:"#f1f5f9",borderRadius:99,height:10,overflow:"hidden",marginBottom:8}}>
      <div style={{width:`${pct}%`,background:color,height:"100%",borderRadius:99}}/>
    </div>
    {p.meta>0 && (()=>{
      const pctMetaProv=Math.min((sp/p.meta)*100,100).toFixed(1);
      const superoMetaProv=sp>p.meta;
      return <div style={{marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#64748b",marginBottom:3}}>
          <span>🎯 Meta de este proveedor</span>
          <span>{fmt(sp)} / {fmt(p.meta)} ({((sp/p.meta)*100).toFixed(1)}%)</span>
        </div>
        <div style={{background:"#f1f5f9",borderRadius:99,height:8,overflow:"hidden"}}>
          <div style={{width:`${pctMetaProv}%`,background:superoMetaProv?"#7c3aed":"#059669",height:"100%",borderRadius:99}}/>
        </div>
      </div>;
    })()}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:8}}>
      <div style={{background:"#fef9c3",borderRadius:6,padding:"6px 8px",textAlign:"center"}}>
        <div style={{fontSize:10,color:"#92400e"}}>Int. pendiente</div>
        <div style={{fontSize:13,fontWeight:700,color:"#b45309"}}>{fmt(intPend)}</div>
      </div>
      <div style={{background:"#dcfce7",borderRadius:6,padding:"6px 8px",textAlign:"center"}}>
        <div style={{fontSize:10,color:"#166534"}}>Cobrado este mes</div>
        <div style={{fontSize:13,fontWeight:700,color:"#059669"}}>{fmt(intMes)}</div>
      </div>
      <div style={{background:"#eff6ff",borderRadius:6,padding:"6px 8px",textAlign:"center"}}>
        <div style={{fontSize:10,color:"#1e40af"}}>Total histórico</div>
        <div style={{fontSize:13,fontWeight:700,color:"#2563eb"}}>{fmt(intTotal)}</div>
      </div>
    </div>
    {expandido && <div style={{marginTop:10}}>
      {marcadosPendientes.length>0 && <div style={{marginBottom:8,background:"#fff7ed",border:"1px solid #fb923c",padding:"8px 10px",borderRadius:6,fontSize:12,color:"#9a3412"}}>
        🟠 <b>{marcadosPendientes.length} cliente(s) marcados como cobrados</b> pero aún sin registrar en la app — no olvidés registrar sus pagos.
      </div>}
      {seleccionados.length>=2 && <div style={{marginBottom:8,background:"#eff6ff",padding:"8px 10px",borderRadius:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:12,color:"#1e40af",fontWeight:600}}>{seleccionados.length} préstamos seleccionados</span>
        <button style={{padding:"5px 12px",background:"#2563eb",color:"#fff",border:"none",borderRadius:5,fontSize:12,cursor:"pointer",fontWeight:600}} onClick={()=>{
          const prestamosSel=prestamosDelProv.filter(pr=>seleccionados.includes(pr.id));
          const clienteIds=[...new Set(prestamosSel.map(pr=>pr.clienteId))];
          if(clienteIds.length>1){alert("Solo podés combinar préstamos del mismo cliente.");return;}
          const saldoTotal=prestamosSel.reduce((s,pr)=>s+pr.saldo,0);
          const capitalTotal=prestamosSel.reduce((s,pr)=>s+pr.capitalInicial,0);
          const proxMasCercano=prestamosSel.sort((a,b)=>new Date(a.proximoPago)-new Date(b.proximoPago))[0].proximoPago;
          const tasaPromedio=prestamosSel.reduce((s,pr)=>s+(pr.tasaCliente||0.15),0)/prestamosSel.length;
          if(!confirm("¿Combinar "+prestamosSel.length+" préstamos en uno solo de "+fmt(saldoTotal)+"?")) return;
          const nuevoConsolidado={id:Date.now().toString(),clienteId:prestamosSel[0].clienteId,proveedor:p.id,capitalInicial:capitalTotal,saldo:saldoTotal,fechaInicio:hoy(),proximoPago:proxMasCercano,estado:"activo",tasaCliente:tasaPromedio};
          const idsRemover=prestamosSel.map(pr=>pr.id);
          actualizar({...datos,prestamos:[...datos.prestamos.filter(x=>!idsRemover.includes(x.id)),nuevoConsolidado]});
          setSeleccionados([]);
        }}>🔗 Combinar seleccionados</button>
      </div>}
      {prestamosDelProv.length===0?<p style={{color:"#94a3b8",fontSize:13}}>No hay préstamos activos.</p>:
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr>{["","Cliente","Saldo","Tasa","Interés quincena","Próx. pago",""].map(h=><th key={h} style={{background:"#f1f5f9",padding:"7px 8px",textAlign:"left",fontWeight:600,color:"#475569",fontSize:11}}>{h}</th>)}</tr></thead>
          <tbody>{prestamosDelProv.map(pr=>{
            const cl=datos.clientes.find(c=>c.id===pr.clienteId);
            const tc=pr.tasaCliente||0.15;
            const estaPagando=pagandoId===pr.id;
            const yaPagado=pagadosSesion.includes(pr.id);
            const marcado=marcadosPendientes.includes(pr.id);
            const filaColor=yaPagado?"#dcfce7":marcado?"#fed7aa":"transparent";
            return <React.Fragment key={pr.id}>
            <tr style={{background:filaColor}}>
              <td style={{padding:"7px 8px",borderTop:"1px solid #f1f5f9"}}>
                <input type="checkbox" checked={seleccionados.includes(pr.id)} onChange={e=>{
                  if(e.target.checked) setSeleccionados([...seleccionados,pr.id]);
                  else setSeleccionados(seleccionados.filter(x=>x!==pr.id));
                }}/>
              </td>
              <td style={{padding:"7px 8px",borderTop:"1px solid #f1f5f9"}}>
                <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}} title="Marcar como cobrado (pendiente de registrar)">
                  <input type="checkbox" checked={marcado} onChange={()=>toggleMarcado(pr.id)} style={{accentColor:"#ea580c"}}/>
                  <span>{cl?.nombre||"—"} {yaPagado&&"✅"} {marcado&&!yaPagado&&"🟠"}</span>

              <td style={{padding:"7px 8px",borderTop:"1px solid #f1f5f9"}}>{fmt(pr.saldo)}</td>
              <td style={{padding:"7px 8px",borderTop:"1px solid #f1f5f9"}}>{(tc*100).toFixed(1)}%</td>
              <td style={{padding:"7px 8px",borderTop:"1px solid #f1f5f9"}}>{fmt(pr.saldo*tc)}</td>
              <td style={{padding:"7px 8px",borderTop:"1px solid #f1f5f9"}}>{pr.proximoPago}</td>

                <button style={{padding:"4px 8px",background:estaPagando?"#dc2626":"#059669",color:"#fff",border:"none",borderRadius:4,fontSize:11,cursor:"pointer"}} onClick={()=>{
                  if(estaPagando){setPagandoId(null);}
                  else{setPagandoId(pr.id);setMontoPagoInline("");setSoloCapInline(false);}
                }}>{estaPagando?"✕":"💳 Pagar"}</button>
              </td>
            </tr>
            {estaPagando && <tr>
              <td colSpan="7" style={{padding:"8px",background:"#f0fdf4",borderTop:"1px solid #dcfce7"}}>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                  <input type="number" placeholder="Monto recibido" value={montoPagoInline} onChange={e=>setMontoPagoInline(e.target.value)} style={{padding:"5px 8px",border:"1px solid #d1d5db",borderRadius:5,fontSize:12,width:120}}/>
                  <label style={{fontSize:11,display:"flex",alignItems:"center",gap:4}}>
                    <input type="checkbox" checked={soloCapInline} onChange={e=>setSoloCapInline(e.target.checked)}/> Solo capital
                  </label>
                  <button style={{padding:"5px 12px",background:"#2563eb",color:"#fff",border:"none",borderRadius:5,fontSize:12,cursor:"pointer",fontWeight:600}} onClick={()=>{
                    const pago=parseFloat(montoPagoInline);
                    if(!pago||isNaN(pago)||pago<=0) return;
                    const interes=pr.saldo*tc;
                    let interesAplicado=0,capitalAplicado=0;
                    if(soloCapInline){capitalAplicado=pago;}
                    else{interesAplicado=Math.min(pago,interes);capitalAplicado=Math.max(0,pago-interes);}
                    const nuevoSaldo=Math.max(0,pr.saldo-capitalAplicado);
                    const gananciaJorge=soloCapInline?0:pr.saldo*(tc-p.tasa/100);
                    const gananciaProv=soloCapInline?0:pr.saldo*(p.tasa/100);
                    const nuevoPago={id:Date.now().toString(),prestamoId:pr.id,fecha:hoy(),monto:pago,interesAplicado,capitalAplicado,saldoAnterior:pr.saldo,nuevoSaldo,gananciaJorge,gananciaProv,nota:""};
                    const nuevosPrestamos=datos.prestamos.map(x=>x.id===pr.id?{...x,saldo:nuevoSaldo,estado:nuevoSaldo===0?"pagado":"activo",proximoPago:nuevoSaldo>0?proximaQuincena(hoy()):x.proximoPago}:x);
                    actualizar({...datos,prestamos:nuevosPrestamos,pagos:[...datos.pagos,nuevoPago]});
                    setPagandoId(null);setMontoPagoInline("");
                    setPagadosSesion([...pagadosSesion,pr.id]);
                  }}>✔ Confirmar</button>
                </div>
              </td>
            </tr>}
            </React.Fragment>;
          })}</tbody>
        </table>}
      <h4 style={{fontSize:12,fontWeight:600,color:"#475569",margin:"12px 0 6px"}}>Historial de pagos</h4>
      {pagosDelProv.length===0?<p style={{color:"#94a3b8",fontSize:12}}>Sin pagos registrados.</p>:
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr>{["Fecha","Cliente","Pago","Interés","Capital","Tu ganancia"].map(h=><th key={h} style={{background:"#f1f5f9",padding:"6px 8px",textAlign:"left",fontWeight:600,color:"#475569",fontSize:11}}>{h}</th>)}</tr></thead>
          <tbody>{[...pagosDelProv].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(pg=>{

              <td style={{padding:"6px 8px",borderTop:"1px solid #f1f5f9",color:"#7c3aed",fontWeight:600}}>{fmt(pg.gananciaJorge)}</td>

        </table>}
      <div style={{marginTop:10,background:"#f0fdf4",padding:"6px 10px",borderRadius:6,fontSize:12,color:"#059669",marginBottom:8}}>

          const totCap=pgs.reduce((s,pg)=>s+(pg.capitalAplicado||0),0);
          const totACH=totInt+totCap;
          let y=20;
          doc.setFontSize(16);doc.setFont("helvetica","bold");
          doc.text("LIQUIDACION DE PROVEEDOR",105,y,{align:"center"});y+=10;
          doc.setFontSize(10);doc.setFont("helvetica","normal");
          doc.text("Proveedor: "+p.nombre+"  |  Tasa: "+p.tasa+"%  |  Fecha: "+new Date().toISOString().split("T")[0],20,y);y+=10;

          y+=8;doc.setTextColor(0,0,0);
          pgs.forEach((pg,i)=>{

            if(i%2===0){doc.setFillColor(248,250,252);doc.rect(20,y,170,7,"F");}

function Proveedores({datos,actualizar}){

    if(!nombre.trim()||!tasa||isNaN(parseFloat(tasa))) return;

  };
  const guardar=()=>{
    actualizar({...datos,proveedores:datos.proveedores.map(p=>p.id===editId?{...p,nombre:eN.trim(),tasa:parseFloat(eT),meta:parseFloat(eM)||0,clave:eK.trim()}:p)});

    if(datos.prestamos.some(p=>p.proveedor===id&&p.saldo>0)){alert("Tiene préstamos activos.");return;}

    actualizar({...datos,proveedores:datos.proveedores.filter(p=>p.id!==id)});
  };
  const totalCartera=datos.proveedores.reduce((s,p)=>s+datos.prestamos.filter(x=>x.proveedor===p.id&&x.saldo>0).reduce((a,x)=>a+x.saldo,0),0);

        const sp=datos.prestamos.filter(x=>x.proveedor===p.id&&x.saldo>0).reduce((a,x)=>a+x.saldo,0);
        if(sp===0) return null;
        const pct=((sp/totalCartera)*100).toFixed(1);
        const color=COLORES[i%COLORES.length];
        return <ProveedorCard key={p.id} p={p} sp={sp} pct={pct} color={color} datos={datos} actualizar={actualizar}/>;
      })}
    </div>}
    <p style={{color:"#64748b",fontSize:13,marginBottom:14}}>Podés agregar proveedores y ajustar sus tasas cuando quieras.</p>
    <div style={s.form}>

      <input style={{...s.input,flex:"0 1 150px"}} placeholder="Clave de acceso" autoCapitalize="off" autoCorrect="off" spellCheck={false} value={clave} onChange={e=>setClave(e.target.value)}/>
      <label style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:"#475569",whiteSpace:"nowrap"}}>

      <tbody>{datos.proveedores.map(p=>{

        return <tr key={p.id}>
          <td style={s.td}>{editId===p.id?<input style={{...s.input,flex:"none",width:150}} value={eN} onChange={e=>setEN(e.target.value)}/>:p.nombre}</td>

          <td style={s.td}>{editId===p.id?<input style={{...s.input,flex:"none",width:90}} type="number" value={eM} onChange={e=>setEM(e.target.value)}/>:(p.meta?fmt(p.meta):"—")}</td>
          <td style={s.td}>{editId===p.id?<input style={{...s.input,flex:"none",width:100}} autoCapitalize="off" autoCorrect="off" spellCheck={false} value={eK} onChange={e=>setEK(e.target.value)}/>:(p.clave?<span style={{fontFamily:"monospace"}}>{p.clave}</span>:<span style={{color:"#b45309",fontSize:11}}>sin clave (entra libre)</span>)}</td>
          <td style={s.td}>{p.fondo?"✔ Sí":"—"}</td>
          <td style={s.td}>{activos}</td>
          <td style={s.td}>{editId===p.id
            ?<div style={{display:"flex",gap:5}}><button style={s.btn} onClick={guardar}>Guardar</button><button style={s.btnDanger} onClick={()=>setEditId(null)}>Cancelar</button></div>

          }</td>
        </tr>;
      })}</tbody>
    </table></div>
  </div>;
}

                const tel=c.telefono.replace(/\D/g,"");

              <button style={{...s.btnSec,padding:"4px 8px",fontSize:11}} onClick={()=>iniciarEdicion(c)}>✏</button>

function Prestamos({datos,actualizar}){

  const [editTasaId,setEditTasaId]=React.useState(null);

  const [filtEstado,setFiltEstado]=React.useState("");

  const [filtTrabajo,setFiltTrabajo]=React.useState("");
  const trabajosUnicos=[...new Set(datos.clientes.map(c=>(c.trabajo||"").trim()).filter(Boolean))].sort();
  const [editFechaId,setEditFechaId]=React.useState(null);
  const [editFechaVal,setEditFechaVal]=React.useState("");
  const generarContrato=(p,cl,pv)=>{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    const tc=p.tasaCliente||0.15;
    const lineH=8;
    let y=20;
    const line=(txt,bold=false)=>{
      if(bold) doc.setFont("helvetica","bold");
      else doc.setFont("helvetica","normal");
      doc.text(txt,20,y); y+=lineH;
    };
    const space=()=>{y+=4;};

    doc.setFontSize(16);
    doc.setFont("helvetica","bold");
    doc.text("CONTRATO DE PRÉSTAMO PERSONAL",105,y,{align:"center"}); y+=12;

    doc.setFontSize(10);
    doc.setFont("helvetica","normal");
    doc.text(`Fecha: ${p.fechaInicio||hoy()}`,20,y); y+=lineH;
    space();

    line("DATOS DEL PRESTATARIO",true);
    line(`Nombre: ${cl?.nombre||"—"}`);

    line(`Dirección: ${cl?.direccion||"—"}`);
    line(`Trabajo: ${cl?.trabajo||"—"}`);
    space();

    line("CONDICIONES DEL PRÉSTAMO",true);
    line(`Capital prestado: $${p.capitalInicial?.toFixed(2)||"0.00"}`);
    line(`Tasa de interés: ${(tc*100).toFixed(1)}% quincenal`);
    line(`Fecha de inicio: ${p.fechaInicio||"—"}`);
    line(`Primer pago: ${p.proximoPago||"—"}`);

    line(`Saldo actual: $${p.saldo?.toFixed(2)||"0.00"}`);
    space();

    line("CONDICIONES GENERALES",true);
    const condiciones=[
      "1. Los pagos se realizan los días 15 y 30 de cada mes.",
      "2. El interés se calcula sobre el saldo pendiente cada quincena.",
      "3. El pago recibido se aplica primero a intereses y luego a capital.",
      "4. El incumplimiento de pago genera mora sobre el saldo.",
      "5. El prestatario se compromete a honrar la deuda en los plazos acordados.",
    ];
    condiciones.forEach(c=>{doc.text(c,20,y,{maxWidth:170}); y+=lineH;});
    space();space();

    line("FIRMAS",true);
    y+=20;
    doc.line(20,y,80,y); doc.line(120,y,180,y);
    y+=6;
    doc.text("Prestatario",20,y); doc.text("Prestamista",120,y);

    doc.save(`Contrato_${cl?.nombre?.replace(/ /g,"_")||"cliente"}_${p.fechaInicio||hoy()}.pdf`);
  };

  const agregar=()=>{
    if(!clienteId||!proveedor||!monto||isNaN(parseFloat(monto))) return;
    const clSel=datos.clientes.find(c=>c.id===clienteId);
    if(clSel?.categoria==="no_prestar"){
      if(!confirm("⛔ ADVERTENCIA: "+clSel.nombre+" está marcado como 'No prestar más'.\n\n¿Deseás continuar de todas formas?")) return;
    } else if(clSel?.categoria==="riesgo"){
      if(!confirm("🔴 Atención: "+clSel.nombre+" está categorizado como RIESGO.\n\n¿Deseás continuar con el préstamo?")) return;
    }
    const capital=parseFloat(monto);
    const tc=parseFloat(tasaPersonal)/100||0.15;
    actualizar({...datos,prestamos:[...datos.prestamos,{id:Date.now().toString(),clienteId,proveedor,capitalInicial:capital,saldo:capital,fechaInicio:fecha,proximoPago:proximaQuincena(fecha),estado:"activo",tasaCliente:tc}]});
    setMonto("");setClienteId("");setProveedor("");setTasaPersonal("15");
  };
  const guardarTasa=(id)=>{
    const tc=parseFloat(editTasaVal)/100;
    if(isNaN(tc)||tc<=0) return;
    actualizar({...datos,prestamos:datos.prestamos.map(p=>p.id===id?{...p,tasaCliente:tc}:p)});
    setEditTasaId(null);
  };
  const eliminarPrestamo=(id)=>{
    if(!confirm("¿Eliminar este préstamo y sus pagos?")) return;
    actualizar({...datos,prestamos:datos.prestamos.filter(x=>x.id!==id),pagos:datos.pagos.filter(x=>x.prestamoId!==id)});
  };
  const provMap=Object.fromEntries(datos.proveedores.map(p=>[p.id,p]));
  const [calcMonto,setCalcMonto]=React.useState("");
  const [calcTasa,setCalcTasa]=React.useState("15");
  const [calcQuincenas,setCalcQuincenas]=React.useState("4");
  const calcResultado=calcMonto&&!isNaN(parseFloat(calcMonto))?
    (()=>{const m=parseFloat(calcMonto);const t=parseFloat(calcTasa)/100;const q=parseInt(calcQuincenas);
    const cuota=(m*t)/(1-Math.pow(1+t,-q));
    return {cuota,totalPagar:cuota*q,totalInteres:(cuota*q)-m};})():null;

  // Lista de préstamos aplicando los mismos filtros que la tabla de abajo
  const prestamosFiltradosPDF=datos.prestamos.filter(p=>{
    const cl=datos.clientes.find(c=>c.id===p.clienteId);
    if(filtCliente && p.clienteId!==filtCliente) return false;
    if(filtProveedor && p.proveedor!==filtProveedor) return false;
    if(filtEstado && p.estado!==filtEstado) return false;
    if(filtTrabajo && (cl?.trabajo||"").trim()!==filtTrabajo) return false;
    if(filtColor){
      const ahora=new Date();
      const proxPago=new Date(p.proximoPago+"T00:00:00");
      const diasVencido=Math.floor((ahora-proxPago)/(1000*60*60*24));
      const ultimoPago=[...datos.pagos].filter(x=>x.prestamoId===p.id).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0];
      const pagoEnEstaPeriodo=ultimoPago&&new Date(ultimoPago.fecha+"T00:00:00")>=new Date(proxPago.getTime()-16*24*60*60*1000);
      const esMoraAnterior=diasVencido>18;
      let colorTag="normal";
      if(p.estado!=="pagado"){
        if(pagoEnEstaPeriodo) colorTag="verde";
        else if(esMoraAnterior) colorTag="mora_anterior";
        else if(diasVencido>3) colorTag="amarillo";
      }
      if(colorTag!==filtColor) return false;
    }
    return true;
  });

  const exportarListaFiltrada=()=>{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    let y=20;

    // Agrupar por cliente (un cliente puede tener varios préstamos)
    const porCliente={};
    prestamosFiltradosPDF.forEach(p=>{
      const cl=datos.clientes.find(c=>c.id===p.clienteId);
      if(!cl) return;
      if(!porCliente[cl.id]) porCliente[cl.id]={cliente:cl,total:0,cantidad:0};
      porCliente[cl.id].total+=p.saldo;
      porCliente[cl.id].cantidad+=1;
    });
    const lista=Object.values(porCliente).sort((a,b)=>b.total-a.total);
    const totalGeneral=lista.reduce((s,x)=>s+x.total,0);

    const titulo="LISTA DE CLIENTES"+(filtTrabajo?" — "+filtTrabajo.toUpperCase():"")+(filtEstado?" — "+(filtEstado==="activo"?"ACTIVOS":"PAGADOS"):"");
    const cols=[
      {titulo:"Cliente",   x:14},
      {titulo:"Teléfono",  x:78},
      {titulo:"Trabajo",   x:112},
      {titulo:"Préstamos", x:150},
      {titulo:"Total deuda",x:172},
    ];
    const margenInferior=280;

    const encabezado=()=>{
      doc.setFontSize(14); doc.setFont("helvetica","bold");
      doc.text(titulo,105,y,{align:"center"}); y+=8;
      doc.setFontSize(9); doc.setFont("helvetica","normal");
      doc.text(`Generado: ${hoy()}   ·   Clientes: ${lista.length}   ·   Total: ${fmt(totalGeneral)}`,105,y,{align:"center"}); y+=8;
      doc.setFontSize(9); doc.setFont("helvetica","bold");
      cols.forEach(c=>doc.text(c.titulo,c.x,y));
      y+=2; doc.setLineWidth(0.3); doc.line(14,y,196,y); y+=5;
      doc.setFont("helvetica","normal");
    };

    encabezado();
    lista.forEach(({cliente,total,cantidad})=>{

      doc.text(String(cliente.telefono||"—"),cols[1].x,y,{maxWidth:30});
      doc.text(String(cliente.trabajo||"—"),cols[2].x,y,{maxWidth:34});
      doc.text(String(cantidad),cols[3].x,y);
      doc.text(fmt(total).replace("US$","$"),cols[4].x,y);
      y+=7;
    });

    doc.save("Lista_clientes"+(filtTrabajo?"_"+filtTrabajo.replace(/\s+/g,"_"):"")+"_"+hoy()+".pdf");
